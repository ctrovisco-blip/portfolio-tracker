  const [patInput, setPatInput] = useState("");
  const [errMsg,   setErrMsg]   = useState("");
  const modalRef = useRef(null);

  useEffect(() => {
    if (status !== "pat-needed") return;
    const h = e => { if (modalRef.current && !modalRef.current.contains(e.target)) setStatus("idle"); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [status]);

  const doFetch = async (pat) => {
    setStatus("running");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_SCREENER_WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept":        "application/vnd.github+json",
            "Content-Type":  "application/json",
          },
          body: JSON.stringify({ ref: "main", inputs: { tickers: tickers.trim(), mode } }),
        }
      );
      if (res.status === 204) {
        setStatus("ok");
        setTimeout(() => setStatus("idle"), 10000);
      } else {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${res.status}`);
      }
    } catch(e) {
      setErrMsg(e.message);
      setStatus("err");
      setTimeout(() => setStatus("idle"), 5000);
    }
  };

  const handleFetch = () => {
    if (!tickers.trim() || status === "running") return;
    if (token) { doFetch(token); return; }
    setStatus("pat-needed");
  };

  const handlePatSave = () => {
    const pat = patInput.trim();
    if (!pat) return;
    localStorage.setItem("gh_pat", pat);
    setToken(pat);
    doFetch(pat);
  };

  const btnColor = status==="ok"?"#22C55E":status==="err"?"#ef5350":status==="running"?"#F59E0B":"#2962ff";
  const btnLabel = status==="running"?"⏳ A correr...":status==="ok"?"✓ Pedido enviado!":status==="err"?"✗ Erro":"Obter dados";

  return (
    <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
      {/* Ticker input */}
      <input
        value={tickers}
        onChange={e => setTickers(e.target.value)}
        onKeyDown={e => e.key === "Enter" && handleFetch()}
        placeholder="AAPL, MSFT, NVDA..."
        style={{
          minWidth:"200px",maxWidth:"360px",flex:"1",
          background:"#131722",border:"1px solid #2a3042",borderRadius:"6px",
          padding:"6px 10px",color:"#c8ccd4",fontSize:"11px",
          fontFamily:"'Inter',sans-serif",outline:"none",
        }}
      />

      {/* Mode toggle */}
      <div style={{display:"flex",gap:"2px",flexShrink:0}}>
        {[["add","Adicionar"],["replace","Substituir"]].map(([k,l]) => (
          <button key={k} onClick={() => setMode(k)} style={{
            fontSize:"9px",padding:"5px 10px",borderRadius:"20px",cursor:"pointer",
            border: mode===k?"1px solid #5a6478":"1px solid transparent",
            background: mode===k?"#1e2438":"transparent",
            color: mode===k?"#c8ccd4":"#6b7280",
            transition:"all 0.12s",fontFamily:"'Inter',sans-serif",
          }}>{l}</button>
        ))}
      </div>

      {/* Fetch button */}
      <div style={{position:"relative",flexShrink:0}}>
        <button onClick={handleFetch}
          disabled={!tickers.trim() || status === "running"}
          style={{
            fontSize:"10px",fontWeight:"600",padding:"6px 14px",borderRadius:"6px",cursor:"pointer",
            background: !tickers.trim()?"#1e2438":`${btnColor}22`,
            border: `1px solid ${!tickers.trim()?"#2a3042":btnColor}`,
            color: !tickers.trim()?"#5a6478":btnColor,
            fontFamily:"'Inter',sans-serif",transition:"all 0.15s",
          }}>
          {btnLabel}
        </button>

        {/* PAT modal */}
        {status === "pat-needed" && (
          <div ref={modalRef} style={{
            position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:200,
            background:"#1e2438",border:"1px solid #2a3042",borderRadius:"10px",
            padding:"14px",width:"270px",boxShadow:"0 8px 32px #00000099",
          }}>
            <div style={{fontSize:"9px",fontWeight:"600",color:"#c8ccd4",marginBottom:"4px"}}>
              GitHub Personal Access Token
            </div>
            <div style={{fontSize:"9px",color:"#6b7280",marginBottom:"10px",lineHeight:1.6}}>
              Scope necessário: <span style={{color:"#2962ff",fontFamily:"monospace"}}>repo</span>.{" "}
              <a href="https://github.com/settings/tokens/new?scopes=repo&description=Portfolio+Screener"
                target="_blank" rel="noopener" style={{color:"#2962ff",textDecoration:"none"}}>
                Criar token ↗
              </a>
            </div>
            <input autoFocus value={patInput} onChange={e => setPatInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handlePatSave()}
              type="password" placeholder="ghp_xxxxxxxxxxxx"
              style={{width:"100%",background:"#131722",border:"1px solid #2a3042",borderRadius:"6px",
                padding:"6px 8px",color:"#c8ccd4",fontSize:"10px",fontFamily:"monospace",
                outline:"none",marginBottom:"8px"}}/>
            <div style={{display:"flex",gap:"6px",justifyContent:"flex-end"}}>
              <button onClick={() => setStatus("idle")}
                style={{fontSize:"9px",color:"#6b7280",background:"transparent",
                  border:"1px solid #2a3042",borderRadius:"5px",padding:"4px 10px",cursor:"pointer",
                  fontFamily:"'Inter',sans-serif"}}>
                Cancelar
              </button>
              <button onClick={handlePatSave}
                style={{fontSize:"9px",color:"#e0e3eb",background:"#2962ff",
                  border:"1px solid #2962ff",borderRadius:"5px",padding:"4px 12px",
                  fontWeight:"600",cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
                Guardar & Correr
              </button>
            </div>
            <div style={{fontSize:"9px",color:"#2a3042",marginTop:"8px",lineHeight:1.5}}>
              Token guardado apenas neste browser (localStorage).
            </div>
          </div>
        )}

        {/* Error tooltip */}
        {status === "err" && (
          <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:200,
            background:"#1A0000",border:"1px solid #7F1D1D",borderRadius:"6px",
            padding:"8px 10px",width:"220px",fontSize:"9px",color:"#F87171"}}>
            {errMsg}
          </div>
        )}
      </div>

      {status === "ok" && (
        <span style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.3px"}}>
          Aguarda ~1-2 min e actualiza a página
        </span>
      )}
    </div>
  );
}

function ScreenerCard({ ticker, data, onRemove, onDelete }) {
  const inPortfolio = positions.some(p => p.ticker === ticker);
  const col = SECTOR_COLORS[data.sector] || "#5a6478";

  const fmtPct = (v, d=2) => v == null ? "—" : `${v.toFixed(d)}%`;
  const fmtNum = (v, d=1) => v == null ? "—" : v.toFixed(d);
  const fmtStr = (v)       => v == null ? "—" : String(v);

  const yieldCol   = v => v==null?"#6b7280":v>=5?"#089981":v>=2?"#c8ccd4":"#5a6478";
  const peCol      = v => v==null?"#6b7280":v<0?"#ef5350":v<15?"#089981":v<25?"#c8ccd4":v<40?"#F0883E":"#ef5350";
  const pbCol      = v => v==null?"#6b7280":v<1?"#089981":v<3?"#c8ccd4":v<10?"#F0883E":"#ef5350";
  const betaCol    = v => v==null?"#6b7280":v<0.8?"#5b8af5":v<1.2?"#c8ccd4":v<1.5?"#F0883E":"#ef5350";
  const deCol      = v => v==null?"#6b7280":v<50?"#089981":v<100?"#c8ccd4":v<200?"#F0883E":"#ef5350";
  const crCol      = v => v==null?"#6b7280":v>=2?"#089981":v>=1?"#c8ccd4":"#ef5350";
  const cagrCol    = v => v==null?"#6b7280":v>10?"#089981":v>0?"#c8ccd4":"#ef5350";
  const payoutCol  = v => v==null?"#6b7280":v<50?"#089981":v<80?"#F0883E":"#ef5350";
  const marginCol  = v => v==null?"#6b7280":v>50?"#089981":v>25?"#c8ccd4":"#F0883E";
  const fcfCol     = v => v==null?"#6b7280":v>15?"#089981":v>0?"#c8ccd4":"#ef5350";
  const roeCol     = v => v==null?"#6b7280":v>20?"#089981":v>10?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const growthCol  = v => v==null?"#6b7280":v>15?"#089981":v>5?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const epsGrCol   = v => v==null?"#6b7280":v>20?"#089981":v>5?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const psCol      = v => v==null?"#6b7280":v<2?"#089981":v<5?"#c8ccd4":v<10?"#F0883E":"#ef5350";
  const opMarCol   = v => v==null?"#6b7280":v>30?"#089981":v>15?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const upsideCol  = v => v==null?"#6b7280":v>20?"#089981":v>0?"#c8ccd4":v>-10?"#F0883E":"#ef5350";

  const [chartPeriod, setChartPeriod] = useState("6M");

  // Price chart component
  const PriceChart = () => {
    const periodMap = {"1D": data.ph1D, "6M": data.ph6M, "5Y": data.ph5Y, "All": data.phAll};
    const prices = periodMap[chartPeriod] || [];
    const available = Object.keys(periodMap).filter(k => periodMap[k] && periodMap[k].length >= 2);
    if (prices.length < 2 && available.length === 0) return null;
    const activePrices = prices.length >= 2 ? prices : (periodMap[available[0]] || []);
    if (activePrices.length < 2) return null;
    const mn = Math.min(...activePrices), mx = Math.max(...activePrices);
    const range = mx - mn || 1;
    const W = 300, H = 80, pad = 3;
    const isUp = activePrices[activePrices.length - 1] >= activePrices[0];
    const cc = isUp ? "#089981" : "#ef5350";
    const pts = activePrices.map((v, i) => {
      const x = pad + (i / (activePrices.length - 1)) * (W - pad * 2);
      const y = (H - pad) - ((v - mn) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const lastPt = pts[pts.length - 1].split(",");
    const baseY = (H - pad).toFixed(1);
    const areaD = `M${pad},${baseY} L${pts.join(" L")} L${(W-pad).toFixed(1)},${baseY} Z`;
    const pricePct = ((activePrices[activePrices.length-1] - activePrices[0]) / activePrices[0] * 100);
    const gradId = `pg_${ticker}`;
    return (
      <div style={{marginBottom:"8px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
          <span style={{fontSize:"10px",color:cc,fontWeight:"700",fontVariantNumeric:"tabular-nums"}}>
            {pricePct >= 0 ? "+" : ""}{pricePct.toFixed(2)}%
          </span>
          <div style={{display:"flex",gap:"2px"}}>
            {["1D","6M","5Y","All"].filter(p => periodMap[p] && periodMap[p].length >= 2).map(p => (
              <button key={p} onClick={() => setChartPeriod(p)}
                style={{
                  background: chartPeriod===p ? cc+"33" : "transparent",
                  border: `1px solid ${chartPeriod===p ? cc+"66" : "#2a3042"}`,
                  color: chartPeriod===p ? cc : "#5a6478",
                  fontSize:"9px",padding:"1px 6px",borderRadius:"3px",cursor:"pointer",
                  fontWeight: chartPeriod===p ? "700" : "400",
                  transition:"all 0.12s",
                }}>
                {p}
              </button>
            ))}
          </div>
        </div>
        <svg width={W} height={H} style={{width:"100%",display:"block",borderRadius:"4px"}}>
          <defs>
            <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={cc} stopOpacity="0.25"/>
              <stop offset="100%" stopColor={cc} stopOpacity="0.02"/>
            </linearGradient>
          </defs>
          <path d={areaD} fill={`url(#${gradId})`}/>
          <polyline points={pts.join(" ")} fill="none" stroke={cc}
            strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx={lastPt[0]} cy={lastPt[1]} r="2.5" fill={cc}/>
        </svg>
      </div>
    );
  };

  // Mini sparkline SVG for historical trends
  const MiniSparkline = ({ values, color: sc = "#5a6478" }) => {
    if (!values || values.length < 2) return null;
    const mn = Math.min(...values), mx = Math.max(...values);
    const range = mx - mn || 1;
    const W = 48, H = 18, pad = 2;
    const pts = values.map((v, i) => {
      const x = pad + (i / (values.length - 1)) * (W - pad * 2);
      const y = (H - pad) - ((v - mn) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const lx = (W - pad).toFixed(1);
    const ly = ((H - pad) - ((values[values.length-1] - mn) / range) * (H - pad * 2)).toFixed(1);
    return (
      <svg width={W} height={H} style={{flexShrink:0,opacity:0.9}}>
        <polyline points={pts} fill="none" stroke={sc} strokeWidth="1.5"
          strokeLinecap="round" strokeLinejoin="round"/>
        <circle cx={lx} cy={ly} r="2" fill={sc}/>
      </svg>
    );
  };

  const CardItem = ({label, value, color, history}) => (
    <div style={{background:"#131722",borderRadius:"5px",padding:"7px 9px",border:"1px solid #1e2438"}}>
      <div style={{fontSize:"9px",color:"#6b7280",marginBottom:"4px",letterSpacing:"0.5px",textTransform:"uppercase"}}>{label}</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",gap:"4px"}}>
        <div style={{fontSize:"11px",color:color||"#c8ccd4",fontWeight:"600",fontVariantNumeric:"tabular-nums"}}>{value}</div>
        {history && history.length >= 2 && <MiniSparkline values={history} color={color||"#5a6478"}/>}
      </div>
    </div>
  );

  const Section = ({title}) => (
    <div style={{fontSize:"9px",color:"#5a6478",letterSpacing:"1.5px",margin:"10px 0 5px 1px",textTransform:"uppercase"}}>{title}</div>
  );

  const currencySymbol = {EUR:"€",GBP:"£",USD:"$"}[data.currency] || data.currency || "$";

  // 52-week range bar
  const WeekRange = () => {
    if (!data.week52Low || !data.week52High || !data.curPrice) return null;
    const pct = Math.max(0, Math.min(100,
      (data.curPrice - data.week52Low) / (data.week52High - data.week52Low) * 100));
    return (
      <div style={{background:"#131722",borderRadius:"5px",padding:"9px 11px",border:"1px solid #1e2438"}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"5px",alignItems:"center"}}>
          <span style={{fontSize:"9px",color:"#5a6478"}}>{currencySymbol}{data.week52Low.toFixed(2)}</span>
          <span style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textTransform:"uppercase"}}>52 semanas</span>
          <span style={{fontSize:"9px",color:"#5a6478"}}>{currencySymbol}{data.week52High.toFixed(2)}</span>
        </div>
        <div style={{position:"relative",height:"4px",borderRadius:"2px",background:"#1e2438"}}>
          <div style={{
            position:"absolute",height:"100%",borderRadius:"2px",
            background:"linear-gradient(90deg,#ef5350 0%,#F0883E 45%,#089981 100%)",
            width:`${pct}%`,
          }}/>
          <div style={{
            position:"absolute",top:"-4px",width:"2px",height:"12px",
            background:"#e0e3eb",borderRadius:"1px",
            left:`calc(${pct}% - 1px)`,
          }}/>
        </div>
        <div style={{textAlign:"center",marginTop:"4px",fontSize:"8px",color:"#5a6478"}}>
          {pct.toFixed(0)}% do intervalo anual
        </div>
      </div>
    );
  };

  return (
    <div className="screener-card" style={{
      background:"#1a1f2e",borderRadius:"8px",border:"1px solid #2a3042",padding:"12px",
    }}>
      {/* Header */}
      <div style={{borderLeft:"3px solid #2962ff",paddingLeft:"10px",marginBottom:"12px",
        display:"flex",alignItems:"flex-start",gap:"8px"}}>
        <LogoImg ticker={ticker} sector={data.sector} flag={data.flag} size={24}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"9px",color:"#787b86",marginBottom:"2px",display:"flex",
            alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
            <span>{data.flag} {data.exchange} · <span style={{color:"#2962ff"}}>{ticker}</span></span>
            {inPortfolio && (
              <span style={{background:"#2962ff22",color:"#5b8af5",
                border:"1px solid #2962ff33",borderRadius:"3px",padding:"0 5px",
                fontSize:"8px",fontWeight:"600"}}>
                portfolio
              </span>
            )}
          </div>
          <div style={{fontSize:"14px",fontWeight:"700",color:"#e0e3eb",
            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{data.name}</div>
          <div style={{display:"flex",gap:"8px",marginTop:"4px",alignItems:"center",flexWrap:"wrap"}}>
            {data.curPrice != null && (
              <span style={{fontSize:"14px",fontWeight:"600",color:"#c8ccd4",
                fontVariantNumeric:"tabular-nums"}}>
                {currencySymbol}{data.curPrice.toFixed(2)}
              </span>
            )}
            <span style={{fontSize:"9px",background:col+"22",color:col,
              border:`1px solid ${col}44`,borderRadius:"3px",padding:"2px 7px"}}>
              {data.sector}
            </span>
          </div>
        </div>
        <div className="no-print" style={{display:"flex",gap:"3px",flexShrink:0}}>
          <button onClick={() => openPDF([{ticker, data, chartPeriod}])}
            title="Exportar PDF"
            style={{background:"transparent",border:"1px solid #2a3042",color:"#5a6478",
              cursor:"pointer",fontSize:"11px",padding:"3px 7px",lineHeight:1,
              borderRadius:"4px",transition:"all 0.12s"}}
            onMouseEnter={e=>{e.currentTarget.style.color="#5b8af5";e.currentTarget.style.borderColor="#5b8af544";}}
            onMouseLeave={e=>{e.currentTarget.style.color="#5a6478";e.currentTarget.style.borderColor="#2a3042";}}>
            ⎙
          </button>
          {onRemove && (
            <button onClick={() => onRemove(ticker)} title="Ocultar (restaurável)"
              style={{background:"transparent",border:"1px solid #2a3042",color:"#5a6478",
                cursor:"pointer",fontSize:"12px",padding:"3px 7px",lineHeight:1,
                borderRadius:"4px",transition:"all 0.12s"}}
              onMouseEnter={e=>{e.currentTarget.style.color="#c8ccd4";e.currentTarget.style.borderColor="#5a6478";}}
              onMouseLeave={e=>{e.currentTarget.style.color="#5a6478";e.currentTarget.style.borderColor="#2a3042";}}>
              ×
            </button>
          )}
          {onDelete && (
            <button onClick={() => onDelete(ticker)} title="Apagar definitivamente"
              style={{background:"transparent",border:"1px solid #2a3042",color:"#5a6478",
                cursor:"pointer",fontSize:"11px",padding:"3px 7px",lineHeight:1,
                borderRadius:"4px",transition:"all 0.12s"}}
              onMouseEnter={e=>{e.currentTarget.style.color="#ef5350";e.currentTarget.style.borderColor="#ef535044";}}
              onMouseLeave={e=>{e.currentTarget.style.color="#5a6478";e.currentTarget.style.borderColor="#2a3042";}}>
              🗑
            </button>
          )}
        </div>
      </div>

      {/* Price chart */}
      <PriceChart/>

      {/* 52-week range */}
      <WeekRange/>

      <Section title="Avaliação"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px"}}>
        <CardItem label="Market Cap"   value={fmtStr(data.marketCap)}    color="#c8ccd4"/>
        <CardItem label="P/E Ratio"    value={fmtNum(data.pe)}           color={peCol(data.pe)}/>
        <CardItem label="Price/Book"   value={fmtNum(data.priceToBook)}  color={pbCol(data.priceToBook)}/>
        <CardItem label="Price/Sales"  value={fmtNum(data.priceToSales)} color={psCol(data.priceToSales)}/>
        <CardItem label="EV/EBITDA"    value={fmtNum(data.evEbitda)}     color={psCol(data.evEbitda)}/>
        <CardItem label="Beta"         value={fmtNum(data.beta, 2)}      color={betaCol(data.beta)}/>
        <CardItem label="Debt/Equity"  value={data.debtToEquity != null ? `${data.debtToEquity.toFixed(0)}%` : "—"} color={deCol(data.debtToEquity)}/>
        <CardItem label="Curr. Ratio"  value={fmtNum(data.currentRatio, 2)} color={crCol(data.currentRatio)}/>
        <CardItem label="Total Debt"   value={fmtStr(data.totalDebt)}    color={data.totalDebt?"#F0883E":"#6b7280"}/>
        {(() => {
          const upside = (data.targetPrice && data.curPrice) ? ((data.targetPrice / data.curPrice - 1) * 100) : null;
          const label = data.targetPrice != null
            ? `${currencySymbol}${data.targetPrice.toFixed(2)}${upside!=null?` (${upside>0?"+":""}${upside.toFixed(0)}%)`:""}`
            : "—";
          return <CardItem label="Preço Alvo" value={label} color={upsideCol(upside)}/>;
        })()}
      </div>

      <Section title="Rentabilidade"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px"}}>
        <CardItem label="Gross Margin"  value={fmtPct(data.grossMargin)}       color={marginCol(data.grossMargin)} history={data.grossMarginHistory}/>
        <CardItem label="Op. Margin"    value={fmtPct(data.operatingMargin)}   color={opMarCol(data.operatingMargin)}/>
        <CardItem label="Net Margin"    value={fmtPct(data.netMargin)}         color={marginCol(data.netMargin)}   history={data.netMarginHistory}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:"4px",marginTop:"4px"}}>
        <CardItem label="ROE"         value={fmtPct(data.roe)}             color={roeCol(data.roe)}/>
        <CardItem label="ROA"         value={fmtPct(data.roa)}             color={roeCol(data.roa)}/>
        <CardItem label="ROIC"        value={fmtPct(data.roic)}            color={roeCol(data.roic)}/>
        <CardItem label="FCF Yield"   value={fmtPct(data.fcfYield)}        color={fcfCol(data.fcfYield)}     history={data.fcfHistory}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px",marginTop:"4px"}}>
        <CardItem label="Rev. Growth"
          value={data.revenueGrowth != null ? `${data.revenueGrowth>0?"+":""}${data.revenueGrowth.toFixed(1)}%` : "—"}
          color={growthCol(data.revenueGrowth)} history={data.revenueHistory}/>
      </div>

      <Section title="Por Ação"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px"}}>
        <CardItem label="Nº Acções"   value={fmtStr(data.sharesOutstanding)}  color="#c8ccd4"/>
        <CardItem label="EPS"         value={data.eps != null ? `${currencySymbol}${data.eps.toFixed(2)}` : "—"} color="#c8ccd4"/>
        <CardItem label="EPS Growth"  value={data.epsGrowth != null ? `${data.epsGrowth>0?"+":""}${data.epsGrowth.toFixed(1)}%` : "—"} color={epsGrCol(data.epsGrowth)}/>
      </div>

      <Section title="Retorno ao Acionista"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
        <CardItem label="Dividend Yield"    value={fmtPct(data.divYield)}         color={yieldCol(data.divYield)}/>
        <CardItem label="Buyback Yield"     value={fmtPct(data.buybackYield)}     color={yieldCol(data.buybackYield)}/>
        <CardItem label="Shareholder Yield" value={fmtPct(data.shareholderYield)} color={yieldCol(data.shareholderYield)}/>
        <CardItem label="Payout Ratio"      value={fmtPct(data.payoutRatio,1)}    color={payoutCol(data.payoutRatio)}/>
      </div>

      <Section title="Crescimento do Dividendo"/>
      <div style={{background:"#131722",borderRadius:"5px",padding:"9px 11px",border:"1px solid #1e2438",
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textTransform:"uppercase"}}>Div CAGR 5 anos</div>
        <div style={{display:"flex",alignItems:"center",gap:"8px",flexShrink:0}}>
          <div style={{fontSize:"15px",color:cagrCol(data.divCagr5y),fontWeight:"700",
            fontFamily:"'Inter',sans-serif",minWidth:"52px",textAlign:"right"}}>
            {data.divCagr5y != null ? `${data.divCagr5y>0?"+":""}${data.divCagr5y.toFixed(1)}%` : "—"}
          </div>
          {data.divCagr5y != null && (
            <div style={{position:"relative",width:"50px",height:"4px",borderRadius:"2px",
              background:"#1e2438",flexShrink:0}}>
              <div style={{position:"absolute",left:"50%",top:"-2px",width:"1px",height:"8px",background:"#5a6478"}}/>
              <div style={{
                position:"absolute",height:"100%",borderRadius:"2px",
                background:cagrCol(data.divCagr5y),
                left:  data.divCagr5y>=0 ? "50%" : `${Math.max(0,50-Math.min(50,Math.abs(data.divCagr5y)*1.5))}%`,
                width: `${Math.min(50,Math.abs(data.divCagr5y)*1.5)}%`,
              }}/>
            </div>
          )}
        </div>
      </div>

      {/* Acionariado (FMP) */}
      {(data.insiderOwnership != null || data.institutionalOwnership != null ||
        data.shortInterest != null || data.analystBuy != null) && (
        <>
          <Section title="Acionariado"/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
            {data.insiderOwnership != null && (
              <CardItem label="Insiders" value={`${data.insiderOwnership.toFixed(1)}%`}
                color={data.insiderOwnership>5?"#089981":"#c8ccd4"}/>
            )}
            {data.institutionalOwnership != null && (
              <CardItem label="Institucional" value={`${data.institutionalOwnership.toFixed(1)}%`}
                color="#c8ccd4"/>
            )}
            {data.shortInterest != null && (
              <CardItem label="Short Interest" value={`${data.shortInterest.toFixed(1)}%`}
                color={data.shortInterest>10?"#ef5350":data.shortInterest>5?"#F0883E":"#c8ccd4"}/>
            )}
            {data.analystBuy != null && (() => {
              const total = data.analystBuy + data.analystHold + data.analystSell;
              const label = `${data.analystBuy}B · ${data.analystHold}H · ${data.analystSell}S`;
              const buyPct = data.analystBuy / total;
              return <CardItem label={`Analistas (${total})`} value={label}
                color={buyPct>0.6?"#089981":buyPct>0.4?"#c8ccd4":"#F0883E"}/>;
            })()}
          </div>
        </>
      )}

      {/* AI Summary */}
      {data.summary && (
        <div style={{marginTop:"10px",background:"#131722",borderRadius:"6px",
          padding:"10px 12px",border:"1px solid #1e2438"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
            <span style={{fontSize:"9px",color:"#5a6478",letterSpacing:"1px",textTransform:"uppercase"}}>Análise</span>
            <span style={{
              fontSize:"9px",fontWeight:"700",padding:"2px 8px",borderRadius:"20px",
              background:data.summary.verdictColor+"22",
              color:data.summary.verdictColor,
              border:`1px solid ${data.summary.verdictColor}44`,
            }}>{data.summary.verdict}</span>
          </div>
          <p style={{fontSize:"10px",color:"#9ca3af",lineHeight:"1.55",margin:0}}>
            {data.summary.text}
          </p>
        </div>
      )}

      {/* News button */}
      <NewsButton ticker={ticker} label={`${ticker} · ${data.name}`} bgColor="#131722" />

      {data.fetchedAt && (
        <div style={{marginTop:"8px",fontSize:"8px",color:"#5a6478",textAlign:"right",letterSpacing:"0.3px"}}>
          Actualizado: {data.fetchedAt}
        </div>
      )}
    </div>
  );
}

function ScreenerView({ screenerDeleted: deleted, setScreenerDeleted: setDeleted }) {
  const allTickers = Object.keys(SCREENER_DATA);
  const [hidden, setHidden] = useState(() => {
    try { return JSON.parse(localStorage.getItem("screener_hidden") || "[]"); } catch { return []; }
  });

  const hide = t => setHidden(h => {
    const next = [...h, t];
    localStorage.setItem("screener_hidden", JSON.stringify(next));
    return next;
  });
  const del = t => {
    setDeleted(d => {
      const next = [...d, t];
      localStorage.setItem("screener_deleted", JSON.stringify(next));
      return next;
    });
    setHidden(h => {
      const next = h.filter(x => x !== t);
      localStorage.setItem("screener_hidden", JSON.stringify(next));
      return next;
    });
  };
  const restoreHidden = () => {
    setHidden([]);
    localStorage.removeItem("screener_hidden");
  };

  const visible = allTickers.filter(t => !hidden.includes(t) && !deleted.includes(t));

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#131722"}}>

      {/* Top bar */}
      <div className="no-print" style={{
        padding:"10px 16px",borderBottom:"1px solid #2a3042",background:"#1a1f2e",
        display:"flex",gap:"10px",alignItems:"center",flexShrink:0,flexWrap:"wrap",
      }}>
        <ScreenerFetchBar/>
        <div style={{flex:1}}/>
        {hidden.length > 0 && visible.length > 0 && (
          <button onClick={restoreHidden}
            title={`Mostrar ${hidden.length} stock(s) oculta(s)`}
            style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
              background:"#1e2438",border:"1px solid #2a3042",color:"#6b7280",
              fontFamily:"'Inter',sans-serif",flexShrink:0}}>
            Mostrar ocultas ({hidden.length})
          </button>
        )}
        {visible.length > 0 && (
          <button
            onClick={() => openPDF(visible.map(t => ({ticker: t, data: SCREENER_DATA[t], chartPeriod: "6M"})))}
            title={`Exportar ${visible.length} ${visible.length===1?'stock':'stocks'} em PDF`}
            style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
              background:"#1e2438",border:"1px solid #5a6478",color:"#787b86",
              fontFamily:"'Inter',sans-serif",display:"flex",alignItems:"center",gap:"5px",
              transition:"all 0.12s",flexShrink:0}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#c8ccd4";e.currentTarget.style.color="#c8ccd4";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#5a6478";e.currentTarget.style.color="#787b86";}}>
            ⎙ Exportar PDF {visible.length > 1 ? `(${visible.length})` : ""}
          </button>
        )}
      </div>

      {/* Print-only header */}
      <div className="screener-print-header" style={{display:"none",padding:"0 0 12px",
        marginBottom:"12px",borderBottom:"1px solid #2a3042"}}>
        <div style={{fontSize:"16px",fontWeight:"700",color:"#e0e3eb"}}>Análise Fundamental</div>
        <div style={{fontSize:"9px",color:"#6b7280",marginTop:"4px"}}>
          Portfolio Tracker · Cláudio Trovisco · {new Date().toLocaleDateString("pt-PT")}
        </div>
      </div>

      {/* Cards grid or empty state */}
      {visible.length > 0 ? (
        <div style={{overflowY:"auto",flex:1,padding:"16px"}}>
          <div className="screener-grid" style={{
            display:"grid",
            gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",
            gap:"12px",
          }}>
            {visible.map(ticker => (
              <ScreenerCard
                key={ticker}
                ticker={ticker}
                data={SCREENER_DATA[ticker]}
                onRemove={hide}
                onDelete={del}
              />
            ))}
          </div>
        </div>
      ) : (
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
          justifyContent:"center",color:"#5a6478",gap:"14px",padding:"24px"}}>
          <div style={{fontSize:"36px",opacity:0.2}}>🔍</div>
          <div style={{fontSize:"12px",color:"#6b7280",textAlign:"center"}}>
            {allTickers.length === 0
              ? "Sem dados. Introduz tickers acima e clica em \"Obter dados\"."
              : "Todos os cards foram ocultados."}
          </div>
          {allTickers.length === 0 && (
            <div style={{fontSize:"10px",color:"#3d4760",textAlign:"center",maxWidth:"300px",lineHeight:1.7}}>
              Os dados são obtidos via GitHub Actions (~1-2 min).{" "}
              Precisas de um token GitHub com scope{" "}
              <span style={{color:"#2962ff",fontFamily:"monospace"}}>repo</span>.
            </div>
          )}
          {hidden.length > 0 && (
            <button onClick={restoreHidden}
              style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
                background:"#1e2438",border:"1px solid #2a3042",color:"#787b86",
                fontFamily:"'Inter',sans-serif"}}>
              Mostrar ocultas ({hidden.length})
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState("portfolio");
  const [screenerDeleted, setScreenerDeleted] = useState(() => {
    try { return JSON.parse(localStorage.getItem("screener_deleted") || "[]"); } catch { return []; }
  });
  const [sel, setSel]           = useState(null);
  const [mobPanel, setMobPanel] = useState(null); // null | "overview"
  const [mobDetail, setMobDetail] = useState(false); // mobile: detail panel open
  const [filter, setFilter]     = useState("all");
  const [sector, setSector]     = useState("all");
  const [sort, setSort]         = useState("ppl");

  // ── Resizable panes ────────────────────────────────────────────────
  const [rightW, setRightW]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_rightW"));
    return (v >= 180 && v <= 700) ? v : 310;
  });
  const [chartH, setChartH]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_chartH"));
    return (v >= 80 && v <= 600) ? v : 240;
  });
  const dragV = useRef(null); // { startX, startW }
  const dragH = useRef(null); // { startY, startH }

  useEffect(() => { localStorage.setItem("pane_rightW", rightW); }, [rightW]);
  useEffect(() => { localStorage.setItem("pane_chartH", chartH); }, [chartH]);

  function onDividerVMouseDown(e) {
    e.preventDefault();
    dragV.current = { startX: e.clientX, startW: rightW };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = dragV.current.startX - e.clientX;
      const next = Math.max(180, Math.min(700, dragV.current.startW + delta));
      setRightW(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  function onDividerHMouseDown(e) {
    e.preventDefault();
    dragH.current = { startY: e.clientY, startH: chartH };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = e.clientY - dragH.current.startY;
      const next = Math.max(80, Math.min(600, dragH.current.startH + delta));
      setChartH(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }
  // ──────────────────────────────────────────────────────────────────

  const sectors = useMemo(() => [...new Set(positions.map(p => p.sector))].sort(), []);

  const filtered = useMemo(() => {
    let list = [...positions];
    if (filter === "ganhos") list = list.filter(p => p.ppl > 0);
    else if (filter === "perdas") list = list.filter(p => p.ppl < 0);
    if (sector !== "all") list = list.filter(p => p.sector === sector);
    if (sort === "ppl")   list.sort((a,b) => toEur(b.ppl, b.cur) - toEur(a.ppl, a.cur));
    if (sort === "pct")   list.sort((a,b) => pctReturn(b) - pctReturn(a));
    if (sort === "value") list.sort((a,b) => toEur(b.qty*b.curPrice, b.cur) - toEur(a.qty*a.curPrice, a.cur));
    if (sort === "name")  list.sort((a,b) => a.name.localeCompare(b.name));
    return list;
  }, [filter, sector, sort]);

  const selPos = sel ? positions.find(p => p.ticker === sel) : null;
  // Desktop: auto-open detail panel when a stock is selected.
  // Mobile: only opens when user explicitly taps "Ver Indicadores" (mobDetail) or opens overview.
  const isMobile = () => window.matchMedia('(max-width:768px)').matches;
  const panelOpen = !!(mobDetail || mobPanel === "overview");

  const pillStyle = (active) => ({
    padding:"3px 10px",borderRadius:"20px",fontSize:"10px",fontWeight:"500",
    border: active ? "1px solid #5a6478" : "1px solid transparent",
    background: active ? "#1e2438" : "transparent",
    color: active ? "#c8ccd4" : "#6b7280",
    cursor:"pointer",transition:"all 0.12s",whiteSpace:"nowrap",
  });

  return (
    <div style={{background:"#131722",height:"100vh",display:"flex",flexDirection:"column",
      fontFamily:"'Inter',sans-serif",color:"#c8ccd4",fontSize:"11px",overflow:"hidden"}}>

      {/* ── Header ── */}
      <div style={{background:"#1a1f2e",borderBottom:"1px solid #2a3042",padding:"0 16px",
        display:"flex",alignItems:"center",gap:"10px",height:"42px",flexShrink:0}}>
        <span style={{fontSize:"14px",fontWeight:"700",color:"#e0e3eb"}}>Portfolio Tracker</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-name" style={{fontFamily:"'Inter',sans-serif",fontSize:"12px",fontWeight:"700",
          color:"#6b7280",letterSpacing:"-0.2px"}}>Cláudio Trovisco</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-live" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"1.5px"}}>
          TRADING212 · LIVE · {positions.length} POSIÇÕES
        </span>
        <div style={{flex:1}}/>
        {/* Tab navigation */}
        <div className="no-print" style={{display:"flex",gap:"2px",marginRight:"4px"}}>
          {[
            ["portfolio", "Portfolio"],
            ["screener",  (() => { const all = Object.keys(SCREENER_DATA); if (!all.length) return "Screener"; const n = all.filter(t => !screenerDeleted.includes(t)).length; return `Screener${n > 0 ? ` (${n})` : ""}`; })()],
          ].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)} style={{
              fontSize:"9px",padding:"4px 12px",borderRadius:"5px",cursor:"pointer",
              border:      tab===k ? "1px solid #2962ff"    : "1px solid transparent",
              background:  tab===k ? "#2962ff22"            : "transparent",
              color:       tab===k ? "#5b8af5"              : "#6b7280",
              fontFamily:"'Inter',sans-serif",fontWeight: tab===k?"600":"400",
              transition:"all 0.12s",
            }}>{l}</button>
          ))}
        </div>
        <FreshnessIndicator/>
        <DeployCountdown/>
        {/* Botão "Visão Geral" — só visível no mobile via CSS */}
        <button className="mob-overview-btn cb" style={{display:"none",
          fontSize:"9px",color:"#787b86",background:"#1e2438",
          border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}
          onClick={() => { setSel(null); setMobPanel("overview"); }}>
          ≡ Overview
        </button>
        {sel && (
          <button className="hdr-back cb" onClick={()=>setSel(null)}
            style={{fontSize:"9px",color:"#787b86",background:"#1e2438",
              border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}>
            ← Portfolio
          </button>
        )}
      </div>

      {/* ── Summary bar (portfolio only) ── */}
      {tab === "portfolio" && <Summary positions={positions} className="summary-bar"/>}

      {/* ── Screener view ── */}
      {tab === "screener" && <ScreenerView screenerDeleted={screenerDeleted} setScreenerDeleted={setScreenerDeleted}/>}

      {/* ── Main area: left column (chart + list) | right column (detail, full height) ── */}
      {tab === "portfolio" && <div className="main-grid" style={{display:"flex",flex:1,minHeight:0}}>

        {/* ── LEFT COLUMN ── */}
        <div style={{display:"flex",flexDirection:"column",flex:1,minWidth:0,overflow:"hidden"}}>

          {/* Chart */}
          <div className="chart-wrap" style={{flexShrink:0,height:`${chartH}px`,borderBottom:"1px solid #2a3042"}}>
            <ChartPanel sel={sel} positions={positions}/>
          </div>

          {/* "Ver Indicadores" button — mobile only, shown when a stock is selected */}
          {sel && selPos && (
            <div className="mob-indicators-btn" style={{display:"none",
              padding:"8px 12px", borderBottom:"1px solid #2a3042",
              background:"#1a1f2e", flexShrink:0}}>
              <button onClick={() => setMobDetail(true)} style={{
                width:"100%", padding:"9px", borderRadius:"6px",
                background:"#2a3042", border:"1px solid #3a4060",
                color:"#c8ccd4", fontSize:"12px", fontWeight:"600",
                cursor:"pointer", letterSpacing:"0.3px",
              }}>
                Ver Indicadores — {selPos.name} →
              </button>
            </div>
          )}

          {/* Horizontal divider — resize chart height */}
          <div className="divider-h" onMouseDown={onDividerHMouseDown} title="Arrastar para redimensionar"/>

          {/* Filter bar */}
          <div className="filter-bar" style={{padding:"6px 12px",borderBottom:"1px solid #2a3042",
            display:"flex",gap:"4px",alignItems:"center",flexShrink:0,background:"#1a1f2e"}}>

            <div style={{display:"flex",gap:"3px"}}>
              {[["all","Todas"],["ganhos","✦ Ganhos"],["perdas","✦ Perdas"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(filter===k)}

            </div>

            <div className="filter-sep-v" style={{width:"1px",height:"14px",background:"#2a3042",margin:"0 2px"}}/>

            <div style={{position:"relative",display:"flex",alignItems:"center"}}>
              <select value={sector} onChange={e=>setSector(e.target.value)}

                  color:sector!=="all"?"#c8ccd4":"#6b7280",fontSize:"10px",fontWeight:"500",
                  padding:"3px 22px 3px 10px",fontFamily:"'Inter',sans-serif",outline:"none"}}>
                <option value="all">Sector</option>
                {sectors.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <span style={{position:"absolute",right:"8px",color:"#6b7280",fontSize:"8px",pointerEvents:"none"}}>▾</span>
            </div>

            <div style={{flex:1}}/>

            <div className="filter-row-sort" style={{display:"flex",gap:"2px",alignItems:"center"}}>
              <span className="sort-label" style={{fontSize:"8px",color:"#5a6478",marginRight:"2px"}}>ordenar</span>
              {[["ppl","P&L€"],["pct","P&L%"],["value","Valor"],["name","A-Z"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(sort===k)}
                  onClick={() => setSort(k)}>{l}</button>
              ))}
              <button className="mob-overview-sort cb" style={{...pillStyle(false),display:"none",marginLeft:"4px"}}
                onClick={() => { setSel(null); setMobPanel("overview"); }}>
                ≡ Overview
              </button>
            </div>
          </div>

          {/* Table header */}
          <div className="pos-grid" style={{padding:"5px 12px",background:"#1a1f2e",
            borderBottom:"1px solid #1a1f2e",flexShrink:0}}>
            <div style={{fontSize:"9px",color:"#6b7280"}}></div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px"}}>EMPRESA</div>
            <div className="col-price-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>PREÇO</div>
            <div className="col-invested-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>INVESTIDO</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>VALOR</div>
            <div className="col-weight-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>PESO</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>RETORNO</div>
          </div>

          {/* Rows */}
          <div style={{overflowY:"auto",flex:1}}>
            {filtered.map(p => (
              <PositionRow key={p.ticker} p={p}

                onClick={() => { const next = sel===p.ticker ? null : p.ticker; setSel(next); setMobPanel(null); setMobDetail(!isMobile() && !!next); }}/>

        {/* Vertical divider — resize right column width */}
        <div className="divider-v" onMouseDown={onDividerVMouseDown} title="Arrastar para redimensionar"/>

        <div className={`right-col${panelOpen ? " open" : ""}`}
          style={{width:`${rightW}px`,flexShrink:0,overflowY:"auto",background:"#131722"}}>

          {/* Botão voltar — só visível no mobile (display:none no desktop via CSS) */}
          <div className="mob-back" style={{
            display:"none", position:"sticky", top:0, zIndex:10,
            background:"#1a1f2e", borderBottom:"1px solid #2a3042",
            padding:"0 16px", height:"48px",
            alignItems:"center", gap:"10px", flexShrink:0,
          }}>
            <button className="cb" onClick={() => { setSel(null); setMobPanel(null); setMobDetail(false); }} style={{
              fontSize:"12px", color:"#c8ccd4", background:"transparent",
              border:"none", padding:"8px 0", display:"flex", alignItems:"center", gap:"6px",
            }}>
              ← Voltar
            </button>
            <span style={{fontSize:"12px", fontWeight:"600", color:"#e0e3eb",
              overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
              {selPos ? selPos.name : "Visão Geral"}
            </span>
          </div>

          {selPos
            ? <Detail p={selPos}/>
            : <PortfolioOverview positions={positions} onSelect={(t) => { setSel(t); setMobPanel(null); setMobDetail(!isMobile()); }}/>
          }
        </div>

      </div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
