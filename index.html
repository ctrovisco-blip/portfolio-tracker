        <div style={{display:"flex",justifyContent:"space-between",marginBottom:"5px",alignItems:"center"}}>
          <span style={{fontSize:"9px",color:"#5a6478"}}>{currencySymbol}{data.week52Low.toFixed(2)}</span>
          <span style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textTransform:"uppercase"}}>52 semanas</span>
          <span style={{fontSize:"9px",color:"#5a6478"}}>{currencySymbol}{data.week52High.toFixed(2)}</span>
        </div>
        <div style={{position:"relative",height:"4px",borderRadius:"2px",background:"#1e2438"}}>
          <div style={{
            position:"absolute",height:"100%",borderRadius:"2px",
            background:"linear-gradient(90deg,#ef5350 0%,#F0883E 45%,#089981 100%)",
            width:`${pct}%`,
          }}/>
          <div style={{
            position:"absolute",top:"-4px",width:"2px",height:"12px",
            background:"#e0e3eb",borderRadius:"1px",
            left:`calc(${pct}% - 1px)`,
          }}/>
        </div>
        <div style={{textAlign:"center",marginTop:"4px",fontSize:"8px",color:"#5a6478"}}>
          {pct.toFixed(0)}% do intervalo anual
        </div>
      </div>
    );
  };

  return (
    <div className="screener-card" style={{
      background:"#1a1f2e",borderRadius:"8px",border:"1px solid #2a3042",padding:"12px",
    }}>
      {/* Header */}
      <div style={{borderLeft:"3px solid #2962ff",paddingLeft:"10px",marginBottom:"12px",
        display:"flex",alignItems:"flex-start",gap:"8px"}}>
        <LogoImg ticker={ticker} sector={data.sector} flag={data.flag} size={24}/>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"9px",color:"#787b86",marginBottom:"2px",display:"flex",
            alignItems:"center",gap:"6px",flexWrap:"wrap"}}>
            <span>{data.flag} {data.exchange} · <span style={{color:"#2962ff"}}>{ticker}</span></span>
            {inPortfolio && (
              <span style={{background:"#2962ff22",color:"#5b8af5",
                border:"1px solid #2962ff33",borderRadius:"3px",padding:"0 5px",
                fontSize:"8px",fontWeight:"600"}}>
                portfolio
              </span>
            )}
          </div>
          <div style={{fontSize:"14px",fontWeight:"700",color:"#e0e3eb",
            overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{data.name}</div>
          <div style={{display:"flex",gap:"8px",marginTop:"4px",alignItems:"center",flexWrap:"wrap"}}>
            {data.curPrice != null && (
              <span style={{fontSize:"14px",fontWeight:"600",color:"#c8ccd4",
                fontVariantNumeric:"tabular-nums"}}>
                {currencySymbol}{data.curPrice.toFixed(2)}
              </span>
            )}
            <span style={{fontSize:"9px",background:col+"22",color:col,
              border:`1px solid ${col}44`,borderRadius:"3px",padding:"2px 7px"}}>
              {data.sector}
            </span>
          </div>
        </div>
        <div className="no-print" style={{display:"flex",gap:"3px",flexShrink:0}}>
          <button onClick={() => openPDF([{ticker, data, chartPeriod}])}
            title="Exportar PDF"
            style={{background:"transparent",border:"1px solid #2a3042",color:"#5a6478",
              cursor:"pointer",fontSize:"11px",padding:"3px 7px",lineHeight:1,
              borderRadius:"4px",transition:"all 0.12s"}}
            onMouseEnter={e=>{e.currentTarget.style.color="#5b8af5";e.currentTarget.style.borderColor="#5b8af544";}}
            onMouseLeave={e=>{e.currentTarget.style.color="#5a6478";e.currentTarget.style.borderColor="#2a3042";}}>
            ⎙
          </button>
          {onRemove && (
            <button onClick={() => onRemove(ticker)}
              style={{background:"transparent",border:"1px solid #2a3042",color:"#5a6478",
                cursor:"pointer",fontSize:"12px",padding:"3px 7px",lineHeight:1,
                borderRadius:"4px",transition:"all 0.12s"}}
              onMouseEnter={e=>{e.currentTarget.style.color="#ef5350";e.currentTarget.style.borderColor="#ef535044";}}
              onMouseLeave={e=>{e.currentTarget.style.color="#5a6478";e.currentTarget.style.borderColor="#2a3042";}}>
              ×
            </button>
          )}
        </div>
      </div>

      {/* Price chart */}
      <PriceChart/>

      {/* 52-week range */}
      <WeekRange/>

      <Section title="Avaliação"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px"}}>
        <CardItem label="Market Cap"   value={fmtStr(data.marketCap)}    color="#c8ccd4"/>
        <CardItem label="P/E Ratio"    value={fmtNum(data.pe)}           color={peCol(data.pe)}/>
        <CardItem label="Price/Book"   value={fmtNum(data.priceToBook)}  color={pbCol(data.priceToBook)}/>
        <CardItem label="Price/Sales"  value={fmtNum(data.priceToSales)} color={psCol(data.priceToSales)}/>
        <CardItem label="Beta"         value={fmtNum(data.beta, 2)}      color={betaCol(data.beta)}/>
        <CardItem label="Debt/Equity"  value={data.debtToEquity != null ? `${data.debtToEquity.toFixed(0)}%` : "—"} color={deCol(data.debtToEquity)}/>
        <CardItem label="Curr. Ratio"  value={fmtNum(data.currentRatio, 2)} color={crCol(data.currentRatio)}/>
        <CardItem label="Total Debt"   value={fmtStr(data.totalDebt)}    color={data.totalDebt?"#F0883E":"#6b7280"}/>
        {(() => {
          const upside = (data.targetPrice && data.curPrice) ? ((data.targetPrice / data.curPrice - 1) * 100) : null;
          const label = data.targetPrice != null
            ? `${currencySymbol}${data.targetPrice.toFixed(2)}${upside!=null?` (${upside>0?"+":""}${upside.toFixed(0)}%)`:""}`
            : "—";
          return <CardItem label="Preço Alvo" value={label} color={upsideCol(upside)}/>;
        })()}
      </div>

      <Section title="Rentabilidade"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px"}}>
        <CardItem label="Gross Margin"  value={fmtPct(data.grossMargin)}       color={marginCol(data.grossMargin)} history={data.grossMarginHistory}/>
        <CardItem label="Op. Margin"    value={fmtPct(data.operatingMargin)}   color={opMarCol(data.operatingMargin)}/>
        <CardItem label="Net Margin"    value={fmtPct(data.netMargin)}         color={marginCol(data.netMargin)}   history={data.netMarginHistory}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"4px",marginTop:"4px"}}>
        <CardItem label="ROE"         value={fmtPct(data.roe)}             color={roeCol(data.roe)}/>
        <CardItem label="FCF Yield"   value={fmtPct(data.fcfYield)}        color={fcfCol(data.fcfYield)}     history={data.fcfHistory}/>
        <CardItem label="Rev. Growth"
          value={data.revenueGrowth != null ? `${data.revenueGrowth>0?"+":""}${data.revenueGrowth.toFixed(1)}%` : "—"}
          color={growthCol(data.revenueGrowth)} history={data.revenueHistory}/>
      </div>

      <Section title="Por Ação"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
        <CardItem label="EPS"         value={data.eps != null ? `${currencySymbol}${data.eps.toFixed(2)}` : "—"} color="#c8ccd4"/>
        <CardItem label="EPS Growth"
          value={data.epsGrowth != null ? `${data.epsGrowth>0?"+":""}${data.epsGrowth.toFixed(1)}%` : "—"}
          color={epsGrCol(data.epsGrowth)}/>
      </div>

      <Section title="Retorno ao Acionista"/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"4px"}}>
        <CardItem label="Dividend Yield"    value={fmtPct(data.divYield)}         color={yieldCol(data.divYield)}/>
        <CardItem label="Buyback Yield"     value={fmtPct(data.buybackYield)}     color={yieldCol(data.buybackYield)}/>
        <CardItem label="Shareholder Yield" value={fmtPct(data.shareholderYield)} color={yieldCol(data.shareholderYield)}/>
        <CardItem label="Payout Ratio"      value={fmtPct(data.payoutRatio,1)}    color={payoutCol(data.payoutRatio)}/>
      </div>

      <Section title="Crescimento do Dividendo"/>
      <div style={{background:"#131722",borderRadius:"5px",padding:"9px 11px",border:"1px solid #1e2438",
        display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textTransform:"uppercase"}}>Div CAGR 5 anos</div>
        <div style={{display:"flex",alignItems:"center",gap:"8px",flexShrink:0}}>
          <div style={{fontSize:"15px",color:cagrCol(data.divCagr5y),fontWeight:"700",
            fontFamily:"'Inter',sans-serif",minWidth:"52px",textAlign:"right"}}>
            {data.divCagr5y != null ? `${data.divCagr5y>0?"+":""}${data.divCagr5y.toFixed(1)}%` : "—"}
          </div>
          {data.divCagr5y != null && (
            <div style={{position:"relative",width:"50px",height:"4px",borderRadius:"2px",
              background:"#1e2438",flexShrink:0}}>
              <div style={{position:"absolute",left:"50%",top:"-2px",width:"1px",height:"8px",background:"#5a6478"}}/>
              <div style={{
                position:"absolute",height:"100%",borderRadius:"2px",
                background:cagrCol(data.divCagr5y),
                left:  data.divCagr5y>=0 ? "50%" : `${Math.max(0,50-Math.min(50,Math.abs(data.divCagr5y)*1.5))}%`,
                width: `${Math.min(50,Math.abs(data.divCagr5y)*1.5)}%`,
              }}/>
            </div>
          )}
        </div>
      </div>

      {/* AI Summary */}
      {data.summary && (
        <div style={{marginTop:"10px",background:"#131722",borderRadius:"6px",
          padding:"10px 12px",border:"1px solid #1e2438"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}}>
            <span style={{fontSize:"9px",color:"#5a6478",letterSpacing:"1px",textTransform:"uppercase"}}>Análise</span>
            <span style={{
              fontSize:"9px",fontWeight:"700",padding:"2px 8px",borderRadius:"20px",
              background:data.summary.verdictColor+"22",
              color:data.summary.verdictColor,
              border:`1px solid ${data.summary.verdictColor}44`,
            }}>{data.summary.verdict}</span>
          </div>
          <p style={{fontSize:"10px",color:"#9ca3af",lineHeight:"1.55",margin:0}}>
            {data.summary.text}
          </p>
        </div>
      )}

      {data.fetchedAt && (
        <div style={{marginTop:"8px",fontSize:"8px",color:"#5a6478",textAlign:"right",letterSpacing:"0.3px"}}>
          Actualizado: {data.fetchedAt}
        </div>
      )}
    </div>
  );
}

function ScreenerView() {
  const allTickers = Object.keys(SCREENER_DATA);
  const [hidden, setHidden] = useState([]);
  const visible = allTickers.filter(t => !hidden.includes(t));

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#131722"}}>

      {/* Top bar */}
      <div className="no-print" style={{

  useEffect(() => {
    const check = async () => {
      try {
        const r = await fetch("data/version.json?_=" + Date.now());

// Tabela simples, ordenável. cols: [{k,l,fmt?,align?,color?}]
function AvTable({ cols, rows, initialSort, maxH=420, empty="Sem dados." }) {
  const [sort, setSort] = useState(initialSort || null);
  const sorted = useMemo(() => {
    if (!sort) return rows;
    const [k, dir] = sort;
    return [...rows].sort((a,b) => {
      const x=a[k], y=b[k];
      if (x==null) return 1; if (y==null) return -1;
      return (typeof x==="string" ? x.localeCompare(y) : x-y) * dir;
    });
  }, [rows, sort]);
  if (!rows || !rows.length) return <div style={{color:AV.muted,fontSize:"10px",padding:"6px 0"}}>{empty}</div>;
  return (
    <div style={{overflow:"auto",maxHeight:maxH}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:"10.5px"}}>
        <thead><tr>{cols.map(c => (
          <th key={c.k} onClick={()=>setSort(s => s && s[0]===c.k ? [c.k,-s[1]] : [c.k,-1])}
            style={{position:"sticky",top:0,background:AV.panel,textAlign:c.align||"right",padding:"5px 6px",
              color:AV.muted,fontWeight:"500",fontSize:"9px",letterSpacing:"0.5px",textTransform:"uppercase",
              borderBottom:`1px solid ${AV.border}`,cursor:"pointer",whiteSpace:"nowrap"}}>
            {c.l}{sort && sort[0]===c.k ? (sort[1]>0?" ▲":" ▼") : ""}</th>))}</tr></thead>
        <tbody>{sorted.map((r,i) => (
          <tr key={i} className="row">{cols.map(c => {
            const v = r[c.k];
            return <td key={c.k} style={{textAlign:c.align||"right",padding:"5px 6px",borderBottom:`1px solid ${AV.border}55`,
              color: c.color ? avCol(v) : AV.text, whiteSpace:"nowrap"}}>{c.fmt ? c.fmt(v, r) : (v ?? "—")}</td>;
          })}</tr>))}</tbody>
      </table>
    </div>
  );
}

// Largura real do contentor (para o SVG não deformar o texto dos eixos)
function useWidth(initial=800) {
  const ref = useRef(null);
  const [w, setW] = useState(initial);
  useEffect(() => {
    if (!ref.current) return;
    const ro = new ResizeObserver(es => { const cw = Math.round(es[0].contentRect.width); if (cw > 0) setW(cw); });
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return [ref, w];
}

// Gráfico de linhas SVG. series: [{key,label,color,dash?}], data: [{d,...}]
function AvLines({ data, series, height=220, fmtY = v => avNum(v,0), zero=false }) {
  const [hover, setHover] = useState(null);
  const ref = useRef(null);
  const [box, W] = useWidth();
  const H = height, P = {l:46, r:10, t:10, b:22};
  const vals = data.flatMap(p => series.map(s => p[s.key])).filter(v => v!=null);
  if (data.length < 2 || !vals.length) return <div style={{color:AV.muted,fontSize:"10px"}}>Histórico insuficiente.</div>;
  let lo = Math.min(...vals, zero?0:Infinity), hi = Math.max(...vals, zero?0:-Infinity);
  if (lo===hi) { lo -= 1; hi += 1; }
  const pad = (hi-lo)*0.06; lo -= pad; hi += pad;
  const x = i => P.l + i*(W-P.l-P.r)/(data.length-1);
  const y = v => P.t + (hi-v)*(H-P.t-P.b)/(hi-lo);
  const ticks = Array.from({length:5},(_,i)=> lo + (hi-lo)*i/4);
  const nx = Math.max(2, Math.min(6, Math.floor(W/140)));
  const xt = Array.from({length:nx}, (_,i) => Math.round(i*(data.length-1)/(nx-1)));
  const onMove = e => {
    const r = ref.current.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width * W;
    setHover(Math.max(0, Math.min(data.length-1, Math.round((px-P.l)/(W-P.l-P.r)*(data.length-1)))));
  };
  return (
    <div ref={box} style={{position:"relative"}}>
      <svg ref={ref} viewBox={`0 0 ${W} ${H}`} width="100%" height={H}
        onMouseMove={onMove} onMouseLeave={()=>setHover(null)} style={{display:"block"}}>
        {ticks.map((t,i) => <g key={i}>
          <line x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)} stroke={AV.border} strokeWidth="1"/>
          <text x={P.l-6} y={y(t)+3} fontSize="10" fill={AV.muted} textAnchor="end">{fmtY(t)}</text></g>)}
        {lo<0 && hi>0 && <line x1={P.l} x2={W-P.r} y1={y(0)} y2={y(0)} stroke="#5a6478" strokeWidth="1"/>}
        {xt.map((i,j) => <text key={i} x={x(i)} y={H-6} fontSize="10" fill={AV.muted} textAnchor={j===0?"start":j===xt.length-1?"end":"middle"}>{avDate(data[i].d).slice(3)}</text>)}
        {series.map(s => {
          let path = "", pen = false;
          data.forEach((p,i) => { const v=p[s.key]; if (v==null) { pen=false; return; }
            path += (pen?"L":"M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
          return <path key={s.key} d={path} fill="none" stroke={s.color} strokeWidth={s.width||1.6}
            strokeDasharray={s.dash||""} vectorEffect="non-scaling-stroke"/>;
        })}
        {hover!=null && <line x1={x(hover)} x2={x(hover)} y1={P.t} y2={H-P.b} stroke="#5a6478" strokeDasharray="3,3"/>}
      </svg>
      <div style={{display:"flex",gap:"12px",flexWrap:"wrap",marginTop:"6px",fontSize:"10px"}}>
        {hover!=null && <span style={{color:AV.muted}}>{avDate(data[hover].d)}</span>}
        {series.map(s => <span key={s.key} style={{color:s.color}}>
          ● {s.label}{hover!=null && data[hover][s.key]!=null ? `: ${s.fmt ? s.fmt(data[hover][s.key]) : avNum(data[hover][s.key])}` : ""}</span>)}
      </div>
    </div>
  );
}

// Barras SVG. data: [{label, value, value2?, color?}]
function AvBars({ data, height=160, fmt = v => avNum(v,0), color=AV.blue }) {
  const [box, W] = useWidth();
  if (!data.length) return <div style={{color:AV.muted,fontSize:"10px"}}>Sem dados.</div>;
  const H = height, P = {l:36, r:6, t:8, b:20};
  const hi = Math.max(...data.map(d => Math.max(d.value||0, d.value2||0)), 1);
  const bw = (W-P.l-P.r)/data.length;
  const y = v => P.t + (hi-v)*(H-P.t-P.b)/hi;
  return (
    <div ref={box}><svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{display:"block"}}>
      {[0, hi/2, hi].map((t,i) => <g key={i}><line x1={P.l} x2={W-P.r} y1={y(t)} y2={y(t)} stroke={AV.border}/>
        <text x={P.l-4} y={y(t)+3} fontSize="10" fill={AV.muted} textAnchor="end">{fmt(t)}</text></g>)}
      {data.map((d,i) => <g key={i}>
        <rect x={P.l+i*bw+bw*0.15} y={y(d.value||0)} width={bw*0.7} height={Math.max(0,y(0)-y(d.value||0))}
          fill={d.color||color} rx="1.5"><title>{`${d.label}: ${fmt(d.value)}`}</title></rect>
        {(i % Math.ceil(data.length / Math.max(2, Math.floor(W/70))) === 0) &&
          <text x={P.l+i*bw+bw/2} y={H-6} fontSize="10" fill={AV.muted} textAnchor="middle">{d.label}</text>}
      </g>)}
    </svg></div>
  );
}

}

// Estados dos pedidos: guardados neste browser e, se houver token do GitHub
// (o mesmo do botão Deploy), também em data/cdti_status.json no repositório.
const REC_ESTADOS = [
  ["por_reclamar", "Por reclamar",                 "#5b8af5"],
  ["pedido",       "Pedido de reembolso enviado",  "#d9a441"],
  ["recebido",     "Reembolso recebido",           "#089981"],
  ["recusado",     "Reembolso recusado",           "#ef5350"],
  ["dispensado",   "Dispensar (não vou reclamar)", "#6b7280"],
];
const REC_CURTO = { por_reclamar:"Por reclamar", pedido:"Pedido", recebido:"Recebido", recusado:"Recusado", dispensado:"Dispensado" };
const REC_COR = Object.fromEntries(REC_ESTADOS.map(([k,,c]) => [k,c]));
const REC_LS = "cdti_status";
const REC_FILE = "data/cdti_status.json";

const flagEmoji = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : "🏳️";
const b64utf8 = str => btoa(unescape(encodeURIComponent(str)));
const utf8b64 = b64 => decodeURIComponent(escape(atob(b64.replace(/\n/g, ""))));

function recLoadLocal() {
  try { return JSON.parse(localStorage.getItem(REC_LS) || "{}"); } catch (e) { return {}; }
}

async function recSyncRepo(estados) {
  const pat = (() => { try { return localStorage.getItem("gh_pat"); } catch (e) { return null; } })();
  if (!pat) return "local";
  const api = `https://api.github.com/repos/${GH_REPO}/contents/${REC_FILE}`;
  const h = { "Authorization": `Bearer ${pat}`, "Accept": "application/vnd.github+json" };
  let sha, atual = {};
  const g = await fetch(api + "?ref=main", { headers: h });
  if (g.ok) { const j = await g.json(); sha = j.sha; try { atual = JSON.parse(utf8b64(j.content)).estados || {}; } catch (e) {} }
  else if (g.status !== 404) throw new Error(`GitHub ${g.status}`);
  const merged = { ...atual };
  Object.entries(estados).forEach(([k, v]) => {
    if (!merged[k] || (v.atualizado || "") >= (merged[k].atualizado || "")) merged[k] = v;
  });
  const body = { message: "chore: estado dos pedidos de reembolso de retenção [skip ci]",
    content: b64utf8(JSON.stringify({ estados: merged }, null, 1) + "\n"), branch: "main", ...(sha ? { sha } : {}) };
  const p = await fetch(api, { method: "PUT", headers: { ...h, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!p.ok) throw new Error(`GitHub ${p.status}`);
  return "repo";
}

function FiscalViewInner() {
  const F = ANALYTICS.fiscal;

  const [year, setYear] = useState(years[0]);
  const [lotView, setLotView] = useState("posicao");
  const Y = (F.byYear||[]).find(y => y.ano===year) || {};
  const sales = (F.vendasPorLote||[]).filter(s => s.sellDate.startsWith(String(year)));
  const decl = (F.declaracaoRascunho||{})[String(year)] || [];
  const divDecl = (F.dividendosPorPais||{})[String(year)] || [];
  const L = F.lei31 || {}, S = F.seVenderTudoHoje || {}, TLH = F.taxLossHarvest || {};
  const lots = F.lotesAbertos || [];
  const byPos = useMemo(() => {
    const m = {};
    lots.forEach(l => { const p = m[l.key] || (m[l.key] = {ticker:l.ticker,name:l.name,tipo:l.tipo,costEur:0,valueEur:0,gainEur:0,lots:0,next:null,nextRate:null,saving:0});
      p.costEur += l.costEur||0; p.valueEur += l.valueEur||0; p.gainEur += l.gainEur||0; p.lots++;
      if (l.nextTierDate && (!p.next || l.nextTierDate < p.next)) { p.next = l.nextTierDate; p.nextRate = l.nextTierRatePct; }
      p.saving += l.savingAtNextTierEur||0; });
    return Object.values(m);
  }, [lots]);
  const isCur = year === new Date().getFullYear();

  return (
    <AvShell>

function DividendsViewInner() {
  const D = ANALYTICS.dividends, R = D.recebido, Pv = D.previsao;
  const [tab, setTab] = useState("previsao");
  // Barras: 24 meses recebidos + 12 meses previstos
  const bars = useMemo(() => {
    const out = [], now = new Date();
    for (let i = 23; i >= 0; i--) {
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const v = ((R.porMes||{})[String(d.getFullYear())]||{})[MONTHS[d.getMonth()]] || 0;
      out.push({label:`${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`, value:v, color:AV.green});
    }
    for (let i = 1; i <= 12; i++) {
      const d = new Date(now.getFullYear(), now.getMonth()+i, 1);
      const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
      out.push({label:`${MONTHS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`, value:(Pv.porMes||{})[k]?.netEur || 0, color:"#5b8af588"});
    }
    return out;
  }, []);
  const A = Pv.anoAtual || {};

  return (
    <AvShell>
      <AvQuality/>
      <div style={avGrid(140)}>
        <AvKpi label="Recebido (sempre)" value={avEur(R.totalNetEur)} color={AV.green} sub={`bruto ${avEur(R.totalGrossEur)} · retido ${avEur(R.totalTaxEur)}`}/>

        <AvKpi label="Previsão anual" value={avEur(Pv.estimatedAnnualIncomeNetEur)} sub={`líquido · bruto ${avEur(Pv.estimatedAnnualIncomeEur)}`} hint="Estimativa a partir do historial de cada emitente"/>
        <AvKpi label="Média mensal" value={avEur(Pv.estimatedMonthlyAverageNetEur)} sub="líquida, estimada"/>
        <AvKpi label="Yield da carteira" value={avPct(Pv.portfolioYieldPct,2,false)} sub={`sobre o custo ${avPct(Pv.yieldOnCostPct,2,false)}`}/>
        <AvKpi label="Pagadoras" value={`${Pv.payingPositions}/${Pv.totalPositions}`} sub={Pv.topPayerSharePct ? `a maior: ${avNum(Pv.topPayerSharePct,0)}% do rendimento` : ""}/>
      </div>

      <AvCard title="Rendimento mensal" sub="verde: recebido (24 meses) · azul: previsto (12 meses)">
        <AvBars data={bars} fmt={v=>avNum(v,0)+"€"} height={170}/>
      </AvCard>

      <AvCard right={<AvPills value={tab} onChange={setTab} options={[["previsao","Previsão por posição"],["calendario","Calendário"],["recebido","Recebido por posição"],["anos","Por ano"]]}/>}
        title={{previsao:"Previsão por posição",calendario:"Próximos pagamentos",recebido:"Recebido por posição",anos:"Recebido por ano"}[tab]}>
        {tab==="previsao" && <AvTable initialSort={["estimatedAnnualIncomeNetEur",-1]} rows={Pv.posicoes||[]} cols={[
          {k:"ticker",l:"Título",align:"left",fmt:(v,r)=><span title={r.name}>{v}</span>},{k:"frequencyLabel",l:"Freq.",align:"left"},
          {k:"estimatedAnnualIncomeNetEur",l:"Anual líq.",fmt:v=>avEur(v)},{k:"withholdingRateAppliedPct",l:"Retenção",fmt:v=>avNum(v,0)+"%"},
          {k:"currentYieldPct",l:"Yield",fmt:v=>avPct(v,2,false)},{k:"yieldOnCostPct",l:"YoC",fmt:v=>avPct(v,2,false)},
          {k:"dpsCagr5yPct",l:"Cresc. 5a",fmt:(v,r)=>avPct(v ?? r.dpsCagr3yPct,1),color:true},
          {k:"stability",l:"Estab.",fmt:v=>v!=null?v:"—"},
          {k:"payoutRatioPct",l:"Payout",fmt:v=>v!=null?<span style={{color:v>100?AV.red:v>80?AV.amber:AV.text}}>{avNum(v,0)}%</span>:"—"},
          {k:"nextExDate",l:"Próx. ex-div.",fmt:v=>v?avDate(v)+" *":"—"},{k:"shareOfIncomePct",l:"Peso",fmt:v=>avNum(v,1)+"%"}]}/>}
        {tab==="calendario" && <AvTable rows={(Pv.calendario||[]).slice(0,60)} cols={[

            {k:"grossEur",l:"Bruto",fmt:v=>avEur(v)},{k:"taxEur",l:"Retido",fmt:v=>avEur(v)},{k:"netEur",l:"Líquido",fmt:v=>avEur(v)},
            {k:"variacaoPct",l:"Variação",fmt:v=>avPct(v,1),color:true}]}/>
          {R.variacaoAnual && <div style={{marginTop:"10px"}}>
            <div style={{fontSize:"10px",color:AV.muted,marginBottom:"4px"}}>De {R.variacaoAnual.de} para {R.variacaoAnual.para}: {avSEur(R.variacaoAnual.deltaEur)} — quem contribuiu</div>
            <AvTable rows={R.variacaoAnual.porPosicao||[]} maxH={220} cols={[{k:"ticker",l:"Título",align:"left"},{k:"de",l:String(R.variacaoAnual.de),fmt:v=>avEur(v)},
              {k:"para",l:String(R.variacaoAnual.para),fmt:v=>avEur(v)},{k:"deltaEur",l:"Δ",fmt:v=>avSEur(v),color:true},{k:"motivo",l:"Motivo",align:"left"}]}/></div>}
        </>}
      </AvCard>

      <AvNote>* Datas previstas pela cadência dos pagamentos anteriores (o pagamento é estimado a +21 dias do ex-dividendo). A previsão
        é uma estimativa: o emitente pode cortar, aumentar ou suspender o dividendo. Os recebidos são exatos, do extrato da corretora.
        · = posição já fechada.</AvNote>
    </AvShell>
  );
}


// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState("portfolio");
  const [sel, setSel]           = useState(null);
  const [mobPanel, setMobPanel] = useState(null); // null | "overview"
  const [mobDetail, setMobDetail] = useState(false); // mobile: detail panel open
  const [filter, setFilter]     = useState("all");
  const [sector, setSector]     = useState("all");
  const [sort, setSort]         = useState("ppl");

  // ── Resizable panes ────────────────────────────────────────────────
  const [rightW, setRightW]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_rightW"));
    return (v >= 180 && v <= 700) ? v : 310;
  });
  const [chartH, setChartH]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_chartH"));
    return (v >= 80 && v <= 600) ? v : 240;
  });
  const dragV = useRef(null); // { startX, startW }
  const dragH = useRef(null); // { startY, startH }

  useEffect(() => { localStorage.setItem("pane_rightW", rightW); }, [rightW]);
  useEffect(() => { localStorage.setItem("pane_chartH", chartH); }, [chartH]);

  function onDividerVMouseDown(e) {
    e.preventDefault();
    dragV.current = { startX: e.clientX, startW: rightW };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = dragV.current.startX - e.clientX;
      const next = Math.max(180, Math.min(700, dragV.current.startW + delta));
      setRightW(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  function onDividerHMouseDown(e) {
    e.preventDefault();
    dragH.current = { startY: e.clientY, startH: chartH };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = e.clientY - dragH.current.startY;
      const next = Math.max(80, Math.min(600, dragH.current.startH + delta));
      setChartH(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }
  // ──────────────────────────────────────────────────────────────────

  const tabs = [
    ["portfolio", "Portfolio"],
    ["screener",  "Screener" + (Object.keys(SCREENER_DATA).length > 0 ? ` (${Object.keys(SCREENER_DATA).length})` : "")],
    ["desempenho","Desempenho"],
    ["fiscal",    "Fiscal"],
    ["dividendos","Dividendos"],
  ];

  const sectors = useMemo(() => [...new Set(positions.map(p => p.sector))].sort(), []);

  const filtered = useMemo(() => {
    let list = [...positions];
    if (filter === "ganhos") list = list.filter(p => p.ppl > 0);
    else if (filter === "perdas") list = list.filter(p => p.ppl < 0);
    if (sector !== "all") list = list.filter(p => p.sector === sector);
    if (sort === "ppl")   list.sort((a,b) => toEur(b.ppl, b.cur) - toEur(a.ppl, a.cur));
    if (sort === "pct")   list.sort((a,b) => pctReturn(b) - pctReturn(a));
    if (sort === "value") list.sort((a,b) => toEur(b.qty*b.curPrice, b.cur) - toEur(a.qty*a.curPrice, a.cur));
    if (sort === "name")  list.sort((a,b) => a.name.localeCompare(b.name));
    return list;
  }, [filter, sector, sort]);

  const selPos = sel ? positions.find(p => p.ticker === sel) : null;
  // Desktop: auto-open detail panel when a stock is selected.
  // Mobile: only opens when user explicitly taps "Ver Indicadores" (mobDetail) or opens overview.
  const isMobile = () => window.matchMedia('(max-width:768px)').matches;
  const panelOpen = !!(mobDetail || mobPanel === "overview");

  const pillStyle = (active) => ({
    padding:"3px 10px",borderRadius:"20px",fontSize:"10px",fontWeight:"500",
    border: active ? "1px solid #5a6478" : "1px solid transparent",
    background: active ? "#1e2438" : "transparent",
    color: active ? "#c8ccd4" : "#6b7280",
    cursor:"pointer",transition:"all 0.12s",whiteSpace:"nowrap",
  });

  return (
    <div className="app-root" style={{background:"#131722",height:"100vh",display:"flex",flexDirection:"column",
      fontFamily:"'Inter',sans-serif",color:"#c8ccd4",fontSize:"11px",overflow:"hidden"}}>
      <UpdateBanner/>

      {/* ── Header ── */}
      <div style={{background:"#1a1f2e",borderBottom:"1px solid #2a3042",padding:"0 16px",
        display:"flex",alignItems:"center",gap:"10px",height:"42px",flexShrink:0}}>
        <span style={{fontSize:"14px",fontWeight:"700",color:"#e0e3eb"}}>Portfolio Tracker</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-name" style={{fontFamily:"'Inter',sans-serif",fontSize:"12px",fontWeight:"700",
          color:"#6b7280",letterSpacing:"-0.2px"}}>Cláudio Trovisco</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-live" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"1.5px"}}>
          TRADING212 · LIVE · {positions.length} POSIÇÕES
        </span>
        <div style={{flex:1}}/>
        {/* Tab navigation */}
        {/* Separadores — botões em linha no desktop; no mobile um seletor (dropdown nativo) */}
        <div className="no-print tab-nav" style={{display:"flex",gap:"2px",marginRight:"4px",overflowX:"auto",minWidth:0,flexShrink:1,scrollbarWidth:"none"}}>
          {tabs.map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)} style={{
              fontSize:"9px",padding:"4px 12px",flexShrink:0,whiteSpace:"nowrap",borderRadius:"5px",cursor:"pointer",
              border:      tab===k ? "1px solid #2962ff"    : "1px solid transparent",
              background:  tab===k ? "#2962ff22"            : "transparent",
              color:       tab===k ? "#5b8af5"              : "#6b7280",
              fontFamily:"'Inter',sans-serif",fontWeight: tab===k?"600":"400",
              transition:"all 0.12s",
            }}>{l}</button>
          ))}
          {/* Dashboard de qualidade de entrada — página própria */}
          <a href="entry_dashboard.html" style={{
            fontSize:"9px",padding:"4px 12px",borderRadius:"5px",cursor:"pointer",
            border:"1px solid transparent",background:"transparent",color:"#6b7280",
            fontFamily:"'Inter',sans-serif",textDecoration:"none",transition:"all 0.12s",
          }}>🎯 Entrada</a>
        </div>
        <div className="no-print tab-select-wrap" style={{display:"none",position:"relative",flexShrink:0}}>
          <select className="tab-select" aria-label="Escolher separador" value={tab}
            onChange={e => {
              if (e.target.value === "__entrada") { window.location.href = "entry_dashboard.html"; return; }
              setTab(e.target.value); setSel(null); setMobPanel(null); setMobDetail(false);
            }}
            style={{fontSize:"12px",fontWeight:"600",color:"#5b8af5",background:"#2962ff22",
              border:"1px solid #2962ff",borderRadius:"6px",padding:"6px 28px 6px 12px",
              fontFamily:"'Inter',sans-serif",minHeight:"32px",maxWidth:"150px"}}>
            {tabs.map(([k, l]) => <option key={k} value={k} style={{background:"#1a1f2e",color:"#c8ccd4"}}>{l}</option>)}
            <option value="__entrada" style={{background:"#1a1f2e",color:"#c8ccd4"}}>🎯 Entrada</option>
          </select>
          <span aria-hidden="true" style={{position:"absolute",right:"10px",top:"50%",transform:"translateY(-50%)",
            pointerEvents:"none",color:"#5b8af5",fontSize:"10px"}}>▾</span>
        </div>
        <FreshnessIndicator/>
        <div className="hdr-deploy"><DeployButton/></div>
        {/* Botão "Visão Geral" — só visível no mobile via CSS */}
        <button className="mob-overview-btn cb" style={{display:"none",
          fontSize:"9px",color:"#787b86",background:"#1e2438",
          border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}
          onClick={() => { setSel(null); setMobPanel("overview"); }}>
          ≡ Overview
        </button>
        {sel && (
          <button className="hdr-back cb" onClick={()=>setSel(null)}
            style={{fontSize:"9px",color:"#787b86",background:"#1e2438",
              border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}>
            ← Portfolio
          </button>
        )}
      </div>

      {/* ── Summary bar (portfolio only) ── */}
      {tab === "portfolio" && <Summary positions={positions} className="summary-bar"/>}

      {/* ── Screener view ── */}
      {tab === "screener" && <ScreenerView/>}

      {/* ── Desempenho · Fiscal · Dividendos (data/analytics.json) ── */}
      {tab === "desempenho" && <PerformanceView/>}
      {tab === "fiscal"     && <FiscalView/>}
      {tab === "dividendos" && <DividendsView/>}

      {/* ── Main area: left column (chart + list) | right column (detail, full height) ── */}
      {tab === "portfolio" && <div className="main-grid" style={{display:"flex",flex:1,minHeight:0}}>

        {/* ── LEFT COLUMN ── */}
        <div className="left-col" style={{display:"flex",flexDirection:"column",flex:1,minWidth:0,overflow:"hidden"}}>

          {/* Chart */}
          <div className="chart-wrap" style={{flexShrink:0,height:`${chartH}px`,borderBottom:"1px solid #2a3042"}}>
            <ChartPanel sel={sel} positions={positions}/>
          </div>

          {/* "Ver Indicadores" button — mobile only, shown when a stock is selected */}
          {sel && selPos && (
            <div className="mob-indicators-btn" style={{display:"none",
              padding:"8px 12px", borderBottom:"1px solid #2a3042",
              background:"#1a1f2e", flexShrink:0}}>
              <button onClick={() => setMobDetail(true)} style={{
                width:"100%", padding:"9px", borderRadius:"6px",
                background:"#2a3042", border:"1px solid #3a4060",
                color:"#c8ccd4", fontSize:"12px", fontWeight:"600",
                cursor:"pointer", letterSpacing:"0.3px",
              }}>
                Ver Indicadores — {selPos.name} →
              </button>
            </div>
          )}

          {/* Horizontal divider — resize chart height */}
          <div className="divider-h" onMouseDown={onDividerHMouseDown} title="Arrastar para redimensionar"/>

          {/* Filter bar */}
          <div className="filter-bar" style={{padding:"6px 12px",borderBottom:"1px solid #2a3042",
            display:"flex",gap:"4px",alignItems:"center",flexShrink:0,background:"#1a1f2e"}}>

            <div style={{display:"flex",gap:"3px"}}>
              {[["all","Todas"],["ganhos","✦ Ganhos"],["perdas","✦ Perdas"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(filter===k)}
                  onClick={() => setFilter(k)}>{l}</button>
              ))}
            </div>

            <div className="filter-sep-v" style={{width:"1px",height:"14px",background:"#2a3042",margin:"0 2px"}}/>

            <div style={{position:"relative",display:"flex",alignItems:"center"}}>
              <select value={sector} onChange={e=>setSector(e.target.value)}
                style={{background:"#1a1f2e",border:"1px solid #2a3042",borderRadius:"20px",
                  color:sector!=="all"?"#c8ccd4":"#6b7280",fontSize:"10px",fontWeight:"500",
                  padding:"3px 22px 3px 10px",fontFamily:"'Inter',sans-serif",outline:"none"}}>
                <option value="all">Sector</option>
                {sectors.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <span style={{position:"absolute",right:"8px",color:"#6b7280",fontSize:"8px",pointerEvents:"none"}}>▾</span>
            </div>

            <div style={{flex:1}}/>

            <div className="filter-row-sort" style={{display:"flex",gap:"2px",alignItems:"center"}}>
              <span className="sort-label" style={{fontSize:"8px",color:"#5a6478",marginRight:"2px"}}>ordenar</span>
              {[["ppl","P&L€"],["pct","P&L%"],["value","Valor"],["name","A-Z"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(sort===k)}
                  onClick={() => setSort(k)}>{l}</button>
              ))}
            </div>
          </div>

          {/* Table header */}
          <div className="pos-grid" style={{padding:"5px 12px",background:"#1a1f2e",
            borderBottom:"1px solid #1a1f2e",flexShrink:0}}>
            <div style={{fontSize:"9px",color:"#6b7280"}}></div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px"}}>EMPRESA</div>
            <div className="col-price-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>PREÇO</div>
            <div className="col-invested-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>INVESTIDO</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>VALOR</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>RETORNO</div>
          </div>

          {/* Rows */}
          <div className="rows-scroll" style={{overflowY:"auto",flex:1}}>
            {filtered.map(p => (
              <PositionRow key={p.ticker} p={p}
                selected={sel===p.ticker}
                onClick={() => { const next = sel===p.ticker ? null : p.ticker; setSel(next); setMobPanel(null); setMobDetail(!isMobile() && !!next); }}/>
            ))}
          </div>
        </div>

        {/* Vertical divider — resize right column width */}
        <div className="divider-v" onMouseDown={onDividerVMouseDown} title="Arrastar para redimensionar"/>

        {/* ── RIGHT COLUMN: Detail (full height; slide-in overlay no mobile) ── */}
        <div className={`right-col${panelOpen ? " open" : ""}`}
          style={{width:`${rightW}px`,flexShrink:0,overflowY:"auto",background:"#131722"}}>

          {/* Botão voltar — só visível no mobile (display:none no desktop via CSS) */}
          <div className="mob-back" style={{
            display:"none", position:"sticky", top:0, zIndex:10,
            background:"#1a1f2e", borderBottom:"1px solid #2a3042",
            padding:"0 16px", height:"48px",
            alignItems:"center", gap:"10px", flexShrink:0,
          }}>
            <button className="cb" onClick={() => { setSel(null); setMobPanel(null); setMobDetail(false); }} style={{
              fontSize:"12px", color:"#c8ccd4", background:"transparent",
              border:"none", padding:"8px 0", display:"flex", alignItems:"center", gap:"6px",
            }}>
              ← Voltar
            </button>
            <span style={{fontSize:"12px", fontWeight:"600", color:"#e0e3eb",
              overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
              {selPos ? selPos.name : "Visão Geral"}
            </span>
          </div>

          {selPos
            ? <Detail p={selPos}/>
            : <PortfolioOverview positions={positions} onSelect={(t) => { setSel(t); setMobPanel(null); setMobDetail(!isMobile()); }}/>
          }
        </div>

      </div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
