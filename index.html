<html lang="pt">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Portfolio Tracker | Cláudio Trovisco</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#131722;font-family:'Inter',sans-serif;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:#1a1f2e;}
::-webkit-scrollbar-thumb{background:#1F2937;border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:#6b7280;}
.cb{cursor:pointer;transition:background 0.12s, color 0.12s, opacity 0.12s;}
.row:hover{background:#1e2438!important;}
.pill{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500;border:none;cursor:pointer;transition:all 0.12s;}
select{appearance:none;-webkit-appearance:none;cursor:pointer;}

/* ── Grelha da tabela de posições (desktop) ───────────────────────── */
.pos-grid{
  display:grid;
  grid-template-columns:20px 1fr 68px 76px 76px 58px 130px;
  gap:4px;
  align-items:center;
}

/* ── Resizable dividers ───────────────────────────────────────────── */
.divider-v{
  width:4px;cursor:col-resize;background:transparent;flex-shrink:0;
  position:relative;z-index:10;transition:background 0.15s;
}
.divider-v:hover,.divider-v.dragging{background:#3d4760;}
.divider-h{
  height:4px;cursor:row-resize;background:transparent;flex-shrink:0;
  position:relative;z-index:10;transition:background 0.15s;
}
.divider-h:hover,.divider-h.dragging{background:#3d4760;}
@media(max-width:768px){
  .divider-v,.divider-h{display:none!important;}

  /* Layout geral — main-grid é flex, anular override de grid */
  .main-grid{overflow:hidden;}
  .chart-wrap{height:200px!important;}

  /* Header: esconder texto secundário e compactar */
  .hdr-sep,.hdr-name,.hdr-live{display:none!important;}
  .hdr-deploy{display:none!important;}
  .hdr-freshness-text{display:none!important;}

  /* Painel direito: slide-in full-screen */
  .right-col{
    position:fixed!important;
    top:0!important;left:0!important;right:0!important;bottom:0!important;
    width:auto!important;
    flex-shrink:0;
    z-index:50;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:#131722;
    border-left:none!important;
    transform:translateX(100%);
    transition:transform 0.28s cubic-bezier(0.4,0,0.2,1);
    will-change:transform;
  }
  .right-col.open{transform:translateX(0);}

  /* Botão voltar mobile */
  .mob-back{display:flex!important;}
  /* Botão "Ver Indicadores" — só visível no mobile */
  .mob-indicators-btn{display:block!important;}

  /* Tabela: logo | empresa | valor+% | retorno */
  .pos-grid{grid-template-columns:20px 1fr 76px 52px 90px!important;}
  .col-price,.col-invested,.col-price-hdr,.col-invested-hdr{display:none!important;}
  .row-spark{display:none!important;}

  /* Barra de filtros: 2 linhas */
  .filter-bar{flex-wrap:wrap!important;gap:6px 4px!important;padding:8px 12px!important;}
  .filter-row-sort{width:100%;border-top:1px solid #1e2438;padding-top:6px;margin-top:0;}
  .filter-sep-v{display:none!important;}
  .sort-label{display:none!important;}

  /* Controlos do gráfico */
  .chart-controls{flex-wrap:wrap!important;gap:4px!important;}

  /* Alvos de toque maiores */
  .pos-row{min-height:50px;}
  .pill{padding:5px 12px!important;font-size:11px!important;}

  /* Summary bar: grid 3x2 */
  .summary-bar{
    display:grid!important;
    grid-template-columns:repeat(3,1fr)!important;
    height:auto!important;
    overflow-x:hidden!important;
  }
  .summary-bar > div{
    padding:8px 12px!important;
    border-right:1px solid #2a3042!important;
    border-bottom:1px solid #2a3042!important;
  }
  .summary-bar > div:nth-child(3),
  .summary-bar > div:nth-child(6){border-right:none!important;}
  .summary-bar > div:nth-child(4),
  .summary-bar > div:nth-child(5),
  .summary-bar > div:nth-child(6){border-bottom:none!important;}
  .summary-bar > div > div:nth-child(2){font-size:13px!important;}
  .summary-bar > div > div:nth-child(3){font-size:9px!important;}

  /* Botão Visão Geral — só mobile */
  .mob-overview-btn{display:flex!important;}

  /* Esconder botão Portfolio do header no mobile */
  .hdr-back{display:none!important;}
}

/* ── Print / PDF export ─────────────────────────────────────────────────── */
@media print {
  @page { size: A4; margin: 12mm; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .no-print { display: none !important; }
  .screener-print-header { display: block !important; }
  .screener-grid {
    display: grid !important;
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 10px !important;
    padding: 0 !important;
  }
  .screener-card { break-inside: avoid; page-break-inside: avoid; }
}
</style>

function toEur(amount, cur) { return amount * (FX_RATES[cur] ?? 1); }
function fmtEur(v) {
  if (Math.abs(v) >= 1e6) return "€" + (v/1e6).toFixed(2) + "M";
  if (Math.abs(v) >= 1e3) return "€" + (v/1e3).toFixed(1) + "k";
  return "€" + v.toFixed(0);
}

function LogoImg({ ticker, sector, flag, size = 20 }) {

  const col = SECTOR_COLORS[sector] || "#5a6478";
  const initial = (ticker || "?")[0].toUpperCase();
  if (err) return (
    <div style={{width:size,height:size,borderRadius:"5px",background:col+"22",
      border:`1px solid ${col}44`,display:"flex",alignItems:"center",justifyContent:"center",
      fontSize:size*0.44,fontWeight:"700",color:col,flexShrink:0,fontFamily:"'Inter',sans-serif"}}>
      {flag || initial}
    </div>
  );
  const src = LOGO_OVERRIDE[ticker] || `https://assets.parqet.com/logos/symbol/${ticker}?format=svg`;

    <img
      src={src}
      width={size} height={size}
      style={{borderRadius:"5px",objectFit:"contain",background:"#d1d4dc",flexShrink:0}}
      onError={() => setErr(true)}
      alt={ticker}/>
  );
}

// ─── LINE CHART ───────────────────────────────────────────────────────────────
function LineChart({ seriesData, color, label, buyDates, overlays=[], range="1y" }) {
  const [hoverIdx, setHoverIdx] = useState(null);
  const svgRef = useRef(null);

  const entries = useMemo(() => Object.entries(seriesData || {}).sort((a,b)=>a[0]>b[0]?1:-1), [seriesData]);

  if (!entries.length) return (
    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",color:"#6b7280",fontSize:"11px"}}>
      Sem dados históricos disponíveis
    </div>
  );

  const W = 700, H = 140;
  const PAD = { top:16, right:58, bottom:26, left:48 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top  - PAD.bottom;

  const values = entries.map(([,v]) => v);
  const dates  = entries.map(([d]) => d);

  // Include overlay values in min/max so they don't clip
  const allVals = [...values];
  overlays.forEach(ov => { if(ov.entries) allVals.push(...ov.entries.map(([,v])=>v)); });
  const minV   = Math.min(...allVals, -1);
  const maxV   = Math.max(...allVals,  1);
  const cRange = maxV - minV || 1;

  const xS = i => PAD.left + (i / Math.max(entries.length - 1, 1)) * cW;
  const yS = v => PAD.top  + cH - ((v - minV) / cRange) * cH;
  const zeroY = yS(0);

  const pts      = values.map((v,i) => `${xS(i).toFixed(1)},${yS(v).toFixed(1)}`);
  const linePath = `M${pts.join(" L")}`;
  const areaPath = `M${xS(0).toFixed(1)},${zeroY.toFixed(1)} L${pts.join(" L")} L${xS(entries.length-1).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const lastV  = values[values.length - 1];
  const isPos  = lastV >= 0;
  const lineCol = color || (isPos ? "#089981" : "#ef5350");
  const safeId  = "c" + label.replace(/[^a-zA-Z0-9]/g, "_");

  // X labels — time for 1D, date otherwise
  const xLabels = [];
  const step = Math.max(1, Math.floor(entries.length / 6));
  const isIntraday = range === "1d";
  for (let i = 0; i < entries.length; i += step) {
    let lbl;
    if (isIntraday) {
      lbl = dates[i]; // already "HH:MM"
    } else {
      const d = new Date(dates[i] + "T12:00:00Z");
      lbl = range === "5y"
        ? d.toLocaleDateString("pt-PT",{month:"short",year:"2-digit"})
        : d.toLocaleDateString("pt-PT",{month:"short",year:"2-digit"});
    }
    xLabels.push({ x: xS(i), label: lbl });
  }

  // Y ticks
  const yTicks = [];
  for (let i = 0; i <= 4; i++) {
    const v = minV + (cRange / 4) * i;
    yTicks.push({ y: yS(v), label: (v >= 0 ? "+" : "") + v.toFixed(1) + "%" });
  }

  const handleMouseMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const mouseX = (e.clientX - rect.left) * (W / rect.width) - PAD.left;
    const idx = Math.round((mouseX / cW) * (entries.length - 1));
    setHoverIdx(Math.max(0, Math.min(entries.length - 1, idx)));
  };

  const handleTouchMove = (e) => {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = e.currentTarget.getBoundingClientRect();
    const mouseX = (touch.clientX - rect.left) * (W / rect.width) - PAD.left;
    const idx = Math.round((mouseX / cW) * (entries.length - 1));
    setHoverIdx(Math.max(0, Math.min(entries.length - 1, idx)));
  };

  const hov = hoverIdx;

  // Last label: position to left if near right edge
  const lastX = xS(entries.length - 1);
  const lastY = yS(lastV);
  const labelText = `${lastV >= 0 ? "+" : ""}${lastV.toFixed(2)}%`;
  const labelAnchor = "end";
  const labelOffX = -8;

  return (
    <div style={{position:"relative",userSelect:"none",height:"100%"}}>
      <svg ref={svgRef} width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}
        preserveAspectRatio="none"
        style={{display:"block"}}
        onMouseMove={handleMouseMove} onMouseLeave={() => setHoverIdx(null)}
        onTouchMove={handleTouchMove} onTouchEnd={() => setHoverIdx(null)}
        style={{display:"block",touchAction:"pan-y"}}>
        <defs>
          <linearGradient id={`grad_${safeId}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={lineCol} stopOpacity={isPos?"0.22":"0.18"}/>
            <stop offset="100%" stopColor={lineCol} stopOpacity="0.01"/>
          </linearGradient>
          <clipPath id={`clip_${safeId}`}>
            <rect x={PAD.left} y={PAD.top} width={cW} height={cH}/>
          </clipPath>
        </defs>

        {/* Zero line */}
        <line x1={PAD.left} y1={zeroY} x2={PAD.left+cW} y2={zeroY}
          stroke="#2D3748" strokeWidth="1" strokeDasharray="4,3"/>

        {/* Grid */}
        {yTicks.filter(t => Math.abs(t.y - zeroY) > 4).map((t,i) => (
          <line key={i} x1={PAD.left} y1={t.y} x2={PAD.left+cW} y2={t.y}
            stroke="#111827" strokeWidth="0.5"/>
        ))}

        {/* Overlay index lines — both series start at 0%, aligned by date/time */}
        {(() => {
          // Map key→x based on main series time span
          const isIntra = range === "1d";
          const toMs = k => isIntra
            ? (parseInt(k.split(":")[0])*60 + parseInt(k.split(":")[1])) // minutes
            : new Date(k+"T12:00:00Z").getTime();
          const ms0 = toMs(dates[0]);
          const ms1 = toMs(dates[dates.length-1]);
          const msR = ms1 - ms0 || 1;
          const keyToX = k => PAD.left + Math.max(0, Math.min(1, (toMs(k)-ms0)/msR)) * cW;

          return overlays.map(ov => {
            if (!ov.entries || !ov.entries.length) return null;
            const pts = ov.entries
              .map(([k,v]) => `${keyToX(k).toFixed(1)},${(PAD.top+cH-((v-minV)/cRange)*cH).toFixed(1)}`)
              .join(" ");
            const [lastK, lastV] = ov.entries[ov.entries.length-1];
            const lastOvX = keyToX(lastK);
            const lastOvY = PAD.top + cH - ((lastV-minV)/cRange)*cH;
            return (
              <g key={ov.label}>
                <polyline points={pts} fill="none" stroke={ov.color}
                  strokeWidth="1.4" strokeDasharray="5,3" opacity="0.8"
                  clipPath={`url(#clip_${safeId})`}/>
                <circle cx={lastOvX} cy={lastOvY} r="2.5" fill={ov.color} opacity="0.9"/>
                <text x={lastOvX+5} y={lastOvY+3} fill={ov.color} fontSize="7.5" fontWeight="700">{ov.label}</text>
                <text x={lastOvX+5} y={lastOvY+12} fill={ov.color} fontSize="7" opacity="0.85">
                  {lastV>=0?"+":""}{lastV.toFixed(1)}%
                </text>
              </g>
            );
          });
        })()}

        {/* Area + Line */}
        <path d={areaPath} fill={`url(#grad_${safeId})`} clipPath={`url(#clip_${safeId})`}/>
        <path d={linePath} fill="none" stroke={lineCol} strokeWidth="1.6"
          clipPath={`url(#clip_${safeId})`}/>

        {/* Y labels */}
        {yTicks.map((t,i) => (
          <text key={i} x={PAD.left-6} y={t.y+3} textAnchor="end"
            fill="#6b7280" fontSize="7.5">{t.label}</text>
        ))}

        {/* X labels */}
        {xLabels.map((l,i) => (
          <text key={i} x={l.x} y={H-5} textAnchor="middle"
            fill="#6b7280" fontSize="7.5">{l.label}</text>
        ))}

        {/* Last value dot + label (anchored to left of dot) */}
        <circle cx={lastX} cy={lastY} r="3.5" fill={lineCol}/>
        <text x={lastX+labelOffX} y={lastY+4} textAnchor={labelAnchor}
          fill={lineCol} fontSize="9" fontWeight="700">{labelText}</text>

        {/* Entry markers */}
        {(buyDates || []).map((bd, bi) => {
          let idx = dates.findIndex(d => d >= bd);
          if (idx < 0) idx = dates.length - 1;
          if (idx < 0) return null;
          const ex = xS(idx);
          const ey = yS(values[idx]);
          const labelAbove = ey > PAD.top + 44;
          const labelY = labelAbove ? ey - 28 : ey + 10;
          const months = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
          const dt = new Date(bd + "T12:00:00Z");
          const dlabel = dt.getDate() + " " + months[dt.getMonth()];
          return (
            <g key={bd}>
              <line x1={ex} y1={PAD.top} x2={ex} y2={PAD.top+cH}
                stroke="#FBBF24" strokeWidth="1" strokeDasharray="3,2"
                opacity={bi===0?0.8:0.45}/>
              <polygon points={`${ex},${ey-5} ${ex+4},${ey} ${ex},${ey+5} ${ex-4},${ey}`}
                fill="#FBBF24" stroke="#131722" strokeWidth="1" opacity={bi===0?1:0.7}/>
              <rect x={ex-17} y={labelY} width="34" height="13" rx="2"
                fill="#1a1f2e" stroke="#FBBF24" strokeWidth="0.6" opacity="0.93"/>
              <text x={ex} y={labelY+9.5} textAnchor="middle"
                fill="#FBBF24" fontSize="6.5" fontWeight="600">{dlabel}</text>
            </g>
          );
        })}

        {/* Hover crosshair */}
        {hov !== null && (<>
          <line x1={xS(hov)} y1={PAD.top} x2={xS(hov)} y2={PAD.top+cH}
            stroke="#6b7280" strokeWidth="1" strokeDasharray="3,3"/>
          <circle cx={xS(hov)} cy={yS(values[hov])} r="4"
            fill={lineCol} stroke="#131722" strokeWidth="1.5"/>
        </>)}
      </svg>

      {/* Hover tooltip */}
      {hov !== null && (() => {
        const d   = new Date(dates[hov] + "T12:00:00Z");
        const dFmt = d.toLocaleDateString("pt-PT", {day:"numeric",month:"short",year:"numeric"});
        const v   = values[hov];
        const svgW = svgRef.current?.getBoundingClientRect().width || 700;
        const xPx  = (xS(hov) / W) * svgW;
        const toLeft = xPx > svgW * 0.6;
        return (
          <div style={{position:"absolute",top:"6px",
            ...(toLeft ? {right: `${svgW - xPx + 12}px`} : {left:`${xPx + 12}px`}),
            background:"#1a1f2e",border:`1px solid ${lineCol}50`,borderRadius:"7px",
            padding:"6px 12px",pointerEvents:"none",zIndex:10,minWidth:"90px"}}>
            <div style={{color:"#6b7280",fontSize:"8px",marginBottom:"3px",letterSpacing:"0.3px"}}>{dFmt}</div>
            <div style={{color:lineCol,fontWeight:"700",fontSize:"13px"}}>
              {v>=0?"+":""}{v.toFixed(2)}%
            </div>
          </div>
        );
      })()}
    </div>
  );
}

const IDX_META = {
  SP500:   { label:"S&P 500", color:"#5c8af5" },
  FTSE100: { label:"FTSE",    color:"#F59E0B" },
  DAX:     { label:"DAX",     color:"#EC4899" },

const RANGE_LABELS = { "1d":"1D", "3mo":"3M", "ytd":"YTD", "1y":"1A" };

function ChartPanel({ sel, positions }) {
  const [activeIdxs, setActiveIdxs] = useState([]);

  const isTotal = !sel || sel === "__total__";
  const pos     = positions.find(p => p.ticker === sel);
  const port1y      = CHART_DATA.portfolio?.["1y"] || {};
  const lastPortVal = Object.values(port1y).pop() || 0;
  const isPos       = pos ? pctReturn(pos) >= 0 : lastPortVal >= 0;
  const lineCol     = isPos ? "#089981" : "#ef5350";

  const seriesData = isTotal
    ? (CHART_DATA.portfolio?.[range] || {})
    : (CHART_DATA.stocks?.[sel]?.[range] || {});
  const label  = isTotal ? "portfolio" : (sel || "stock");
  const lastVal = Object.values(seriesData).pop() || 0;

  const overlays = activeIdxs.map(k => ({
    label:   IDX_META[k].label,
    color:   IDX_META[k].color,
    entries: Object.entries(CHART_DATA.indexes?.[k]?.[range] || {}).sort((a,b)=>a[0]>b[0]?1:-1),
  }));

  const pillStyle = (active, color) => ({
    padding:"2px 7px", borderRadius:"4px", fontSize:"9px", fontWeight:"600",
    border:`1px solid ${active ? (color||"#c8ccd4") : "#2a3042"}`,
    background: active ? (color ? color+"22" : "#1e2438") : "transparent",
    color: active ? (color||"#c8ccd4") : "#6b7280",
    cursor:"pointer", transition:"all 0.12s", letterSpacing:"0.3px",

function Summary({ positions }) {
  const totalPpl = positions.reduce((s,p) => s + toEur(p.qty * p.curPrice, p.cur) - toEur(p.qty * p.avgPrice, p.cur), 0);
  const totalRet = TOTAL_COST_EUR > 0 ? (TOTAL_VAL_EUR - TOTAL_COST_EUR) / TOTAL_COST_EUR * 100 : 0;
  const gainers  = positions.filter(p => p.ppl > 0).length;
  const losers   = positions.filter(p => p.ppl < 0).length;
  const best     = [...positions].sort((a,b) => pctReturn(b)-pctReturn(a))[0];
  const worst    = [...positions].sort((a,b) => pctReturn(a)-pctReturn(b))[0];

  const Stat = ({label, value, sub, color, border}) => (
    <div style={{display:"flex",flexDirection:"column",justifyContent:"center",
      padding:"0 18px",borderRight:`1px solid ${border||"#2a3042"}`,minWidth:0,flexShrink:0}}>

      <div style={{fontSize:"15px",fontWeight:"700",color:color||"#d1d4dc",whiteSpace:"nowrap",lineHeight:1.1}}>{value}</div>
      {sub && <div style={{fontSize:"10px",color:"#6b7280",marginTop:"2px",whiteSpace:"nowrap"}}>{sub}</div>}
    </div>
  );

  return (
    <div className="summary-bar" style={{display:"flex",alignItems:"stretch",background:"#131722",
      borderBottom:"1px solid #2a3042",height:"58px",overflowX:"auto",flexShrink:0}}>
      <Stat label="POSIÇÕES"   value={positions.length}    sub="em carteira"   color="#9CA3AF"/>
      <Stat label="P&L TOTAL"  value={(totalPpl>=0?"+":"")+totalPpl.toFixed(0)+"€"} sub={`${totalRet>=0?"+":""}${totalRet.toFixed(2)}% do capital`} color={totalPpl>=0?"#089981":"#ef5350"}/>
      <Stat label="EM GANHO"   value={gainers}             sub={`${((gainers/positions.length)*100).toFixed(0)}% das posições`} color="#089981"/>
      <Stat label="EM PERDA"   value={losers}              sub={`${((losers/positions.length)*100).toFixed(0)}% das posições`}  color="#ef5350"/>
      <Stat label="MELHOR"     value={best.ticker}         sub={`+${pctReturn(best).toFixed(1)}%`} color="#089981"/>
      <Stat label="PIOR"       value={worst.ticker}        sub={`${pctReturn(worst).toFixed(1)}%`} color="#ef5350" border="transparent"/>
    </div>
  );
}

function Sparkline({ ticker, color }) {
  const raw = CHART_DATA.stocks?.[ticker]?.["3mo"] || {};
  const vals = Object.values(raw).filter(v => v != null);
  if (vals.length < 2) return null;
  const mn = Math.min(...vals), mx = Math.max(...vals);
  const range = mx - mn || 1;
  const W = 52, H = 22;
  const pts = vals.map((v, i) =>
    `${((i / (vals.length - 1)) * W).toFixed(1)},${(H - ((v - mn) / range) * H).toFixed(1)}`
  ).join(" ");
  const isPos = vals[vals.length - 1] >= vals[0];
  const c = isPos ? "#089981" : "#ef5350";
  return (
    <svg width={W} height={H} style={{display:"block",flexShrink:0}}>
      <polyline points={pts} fill="none" stroke={c} strokeWidth="1.2" strokeLinejoin="round" strokeLinecap="round" opacity="0.8"/>
    </svg>
  );
}

// ─── PORTFOLIO OVERVIEW PANEL ────────────────────────────────────────────────
function PortfolioOverview({ positions, onSelect }) {
  const sorted   = [...positions].sort((a,b) => pctReturn(b) - pctReturn(a));
  const top3     = sorted.slice(0, 3);
  const bot3     = sorted.slice(-3).reverse();
  const totalVal  = positions.reduce((s,p) => s + toEur(p.qty * p.curPrice, p.cur), 0);
  const totalCost = positions.reduce((s,p) => s + toEur(p.qty * p.avgPrice, p.cur), 0);
  const totalPnl  = totalVal - totalCost;

  // Sector allocation (in EUR)
  const sectorMap = {};
  positions.forEach(p => {
    const v = toEur(p.qty * p.curPrice, p.cur);
    sectorMap[p.sector] = (sectorMap[p.sector] || 0) + v;
  });
  const sectorList = Object.entries(sectorMap)
    .map(([s, v]) => ({ s, v, pct: (v / totalVal) * 100 }))
    .sort((a, b) => b.v - a.v);

  // Country/exchange allocation (in EUR)
  const countryMap = {};
  positions.forEach(p => {
    const v = toEur(p.qty * p.curPrice, p.cur);
    const key = (p.flag || "🌍") + " " + (p.exchange || "—");
    countryMap[key] = (countryMap[key] || 0) + v;
  });
  const countryList = Object.entries(countryMap)
    .map(([k, v]) => ({ k, v, pct: (v / totalVal) * 100 }))
    .sort((a, b) => b.v - a.v);

  // Alertas de concentração
  const posAlerts = positions
    .map(p => ({ ticker: p.ticker, name: p.name, pct: toEur(p.qty * p.curPrice, p.cur) / totalVal * 100 }))
    .filter(x => x.pct > 20)
    .sort((a, b) => b.pct - a.pct);
  const secAlerts = sectorList.filter(x => x.pct > 30);

  const MiniRow = ({ p, rank }) => {
    const ret = pctReturn(p);
    const col = ret >= 0 ? "#089981" : "#ef5350";
    return (
      <div onClick={() => onSelect(p.ticker)}
        style={{display:"flex",alignItems:"center",gap:"8px",padding:"5px 8px",
          borderRadius:"4px",cursor:"pointer",transition:"background 0.1s"}}
        onMouseEnter={e=>e.currentTarget.style.background="#1a1f2e"}
        onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
        <div style={{fontSize:"9px",color:"#5a6478",width:"14px",textAlign:"right",fontVariantNumeric:"tabular-nums"}}>{rank}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:"10px",fontWeight:"600",color:"#c8ccd4",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>
          <div style={{fontSize:"9px",color:"#6b7280"}}>{p.ticker}</div>
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:"11px",fontWeight:"700",color:col,fontVariantNumeric:"tabular-nums"}}>
            {ret>=0?"+":""}{ret.toFixed(1)}%
          </div>
          <div style={{fontSize:"8px",color:ret>=0?"#05614f":"#be3a38",fontVariantNumeric:"tabular-nums"}}>
            {p.ppl>=0?"+":""}{fmtEur(toEur(p.ppl, p.cur)).replace("€","")}€
          </div>
        </div>
      </div>
    );
  };

  const SectionLabel = ({title}) => (
    <div style={{fontSize:"9px",color:"#5a6478",letterSpacing:"1.5px",textTransform:"uppercase",
      padding:"8px 8px 4px",borderTop:"1px solid #1a1f2e",marginTop:"2px"}}>{title}</div>
  );

  return (
    <div style={{padding:"10px 4px 16px"}}>
      {/* Header */}
      <div style={{padding:"2px 8px 10px",borderBottom:"1px solid #1a1f2e"}}>
        <div style={{fontSize:"9px",color:"#5a6478",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:"6px"}}>Visão Geral</div>
        <div style={{display:"flex",gap:"6px"}}>
          {[
            { l:"Total investido", v: fmtEur(totalCost),                                    c:"#c8ccd4" },
            { l:"Valor actual",    v: fmtEur(totalVal),                                     c:"#c8ccd4" },
            { l:"P&L total",       v: (totalPnl>=0?"+":"")+fmtEur(totalPnl).replace("€","")+"€", c: totalPnl>=0?"#089981":"#ef5350" },

// ─── DEPLOY BUTTON ────────────────────────────────────────────────────────────
const GH_REPO     = "ctrovisco-blip/portfolio-tracker";
const GH_WORKFLOW = "update.yml";

function DeployButton() {
  const [status, setStatus]   = useState("idle"); // idle | asking | running | ok | err
  const [token, setToken]     = useState(() => localStorage.getItem("gh_pat") || "");
  const [inputVal, setInput]  = useState("");
  const [errMsg, setErrMsg]   = useState("");
  const ref = useRef(null);

  // Fechar modal ao clicar fora
  useEffect(() => {
    if (status !== "asking") return;
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setStatus("idle"); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [status]);

  const trigger = async (pat) => {
    setStatus("running");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ ref: "main" }),
        }
      );
      if (res.status === 204) {
        setStatus("ok");
        setTimeout(() => setStatus("idle"), 4000);
      } else {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${res.status}`);
      }
    } catch(e) {
      setErrMsg(e.message);
      setStatus("err");
      setTimeout(() => setStatus("idle"), 5000);
    }
  };

  const handleClick = () => {
    if (status === "running") return;
    if (token) { trigger(token); return; }
    setInput(""); setStatus("asking");
  };

  const handleSave = () => {
    const pat = inputVal.trim();
    if (!pat) return;
    localStorage.setItem("gh_pat", pat);
    setToken(pat);
    trigger(pat);
  };

  const handleClear = (e) => {
    e.stopPropagation();
    localStorage.removeItem("gh_pat");
    setToken(""); setStatus("idle");
  };

  const btnColor = status==="ok" ? "#22C55E" : status==="err" ? "#ef5350" : "#787b86";
  const btnBg    = status==="ok" ? "#14532D22" : status==="err" ? "#7F1D1D22" : "#1e2438";
  const btnBorder= status==="ok" ? "#22C55E" : status==="err" ? "#ef5350" : "#5a6478";
  const btnLabel = status==="running" ? "⏳" : status==="ok" ? "✓ A correr" : status==="err" ? "✗ Erro" : "↻ Deploy";

  return (
    <div ref={ref} style={{position:"relative"}}>
      <div style={{display:"flex",alignItems:"center",gap:"2px"}}>
        <button className="cb" onClick={handleClick}
          style={{fontSize:"9px",color:btnColor,background:btnBg,
            border:`1px solid ${btnBorder}`,borderRadius:token?"5px 0 0 5px":"5px",
            padding:"4px 10px",fontFamily:"'Inter',sans-serif",
            animation: status==="running" ? "spin 1s linear infinite" : "none"}}>
          {btnLabel}
        </button>
        {token && status==="idle" && (
          <button className="cb" onClick={handleClear} title="Remover token"
            style={{fontSize:"9px",color:"#6b7280",background:"#1a1f2e",
              border:"1px solid #2a3042",borderRadius:"0 5px 5px 0",borderLeft:"none",
              padding:"4px 6px",fontFamily:"'Inter',sans-serif"}}>
            ×
          </button>
        )}
      </div>

      {/* Modal para introduzir PAT */}
      {status === "asking" && (
        <div style={{position:"absolute",top:"calc(100% + 6px)",right:0,zIndex:200,
          background:"#1e2438",border:"1px solid #2a3042",borderRadius:"10px",
          padding:"14px",width:"260px",boxShadow:"0 8px 32px #00000099"}}>
          <div style={{fontSize:"9px",fontWeight:"600",color:"#c8ccd4",marginBottom:"4px"}}>
            GitHub Personal Access Token
          </div>
          <div style={{fontSize:"9px",color:"#6b7280",marginBottom:"10px",lineHeight:1.6}}>
            Precisa do scope <span style={{color:"#2962ff",fontFamily:"monospace"}}>repo</span>.{" "}
            <a href="https://github.com/settings/tokens/new?scopes=repo&description=Portfolio+Deploy"
              target="_blank" rel="noopener"
              style={{color:"#2962ff",textDecoration:"none"}}>Criar token Classic ↗</a>
          </div>
          <input autoFocus value={inputVal} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&handleSave()}
            type="password" placeholder="ghp_xxxxxxxxxxxx"
            style={{width:"100%",background:"#131722",border:"1px solid #2a3042",borderRadius:"6px",
              padding:"6px 8px",color:"#c8ccd4",fontSize:"10px",fontFamily:"monospace",
              outline:"none",marginBottom:"8px"}}/>
          <div style={{display:"flex",gap:"6px",justifyContent:"flex-end"}}>
            <button className="cb" onClick={()=>setStatus("idle")}
              style={{fontSize:"9px",color:"#6b7280",background:"transparent",border:"1px solid #2a3042",
                borderRadius:"5px",padding:"4px 10px"}}>Cancelar</button>
            <button className="cb" onClick={handleSave}
              style={{fontSize:"9px",color:"#e0e3eb",background:"#2962ff",border:"1px solid #2962ff",
                borderRadius:"5px",padding:"4px 12px",fontWeight:"600"}}>Guardar & Correr</button>
          </div>
          <div style={{fontSize:"9px",color:"#2a3042",marginTop:"8px",lineHeight:1.5}}>
            O token fica guardado apenas neste browser (localStorage). Nunca é enviado para servidores externos.
          </div>
        </div>
      )}
      {status === "err" && (
        <div style={{position:"absolute",top:"calc(100% + 6px)",right:0,zIndex:200,
          background:"#1A0000",border:"1px solid #7F1D1D",borderRadius:"6px",
          padding:"8px 10px",width:"200px",fontSize:"9px",color:"#F87171"}}>
          {errMsg}
        </div>
      )}
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

// ─── FRESHNESS INDICATOR ──────────────────────────────────────────────────────
function FreshnessIndicator() {
  const [show, setShow] = useState(false);
  const ref = useRef(null);

  // Fecha o tooltip ao clicar fora
  useEffect(() => {
    if (!show) return;
    const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setShow(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [show]);

  // Determina a "idade" mais velha dos dados (excluindo fundamentais — mudam trimestralmente)
  function ageMinutes(ts) {
    if (!ts || ts === "n/a") return 9999;
    const d = new Date(ts.replace(" UTC","Z").replace(" ","T"));
    return (Date.now() - d.getTime()) / 60000;
  }
  const ages = {
    "Posições":   ageMinutes(TIMESTAMPS.positions),
    "Gráficos":   ageMinutes(TIMESTAMPS.chart),
    "FX":         ageMinutes(TIMESTAMPS.fx),
    "Fundament.": ageMinutes(TIMESTAMPS.fundamentals),
  };
  const tsLabels = {
    "Posições":   TIMESTAMPS.positions,
    "Gráficos":   TIMESTAMPS.chart,
    "FX":         TIMESTAMPS.fx,
    "Fundament.": TIMESTAMPS.fundamentals,
  };
  const maxAge = Math.max(...Object.values(ages).filter(v => v < 9999));
  // Verde < 4h, Amarelo < 25h, Vermelho >= 25h
  const dot = maxAge < 240 ? "#22C55E" : maxAge < 1500 ? "#F59E0B" : "#ef5350";
  const label = maxAge < 240
    ? maxAge < 60 ? `${Math.round(maxAge)}m` : `${(maxAge/60).toFixed(1)}h`
    : maxAge < 9999 ? `${(maxAge/60/24).toFixed(1)}d`
    : "?";

  return (
    <div ref={ref} style={{position:"relative",display:"flex",alignItems:"center",gap:"5px",cursor:"pointer"}}
      onClick={() => setShow(s => !s)}>
      {/* Dot animado */}
      <div style={{position:"relative",width:"7px",height:"7px"}}>
        <div style={{position:"absolute",inset:0,borderRadius:"50%",background:dot,opacity:0.35,
          animation: dot==="#22C55E" ? "ping 2s cubic-bezier(0,0,0.2,1) infinite" : "none"}}/>
        <div style={{position:"absolute",inset:"1px",borderRadius:"50%",background:dot}}/>
      </div>
      <span className="hdr-freshness-text" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.4px",fontVariantNumeric:"tabular-nums"}}>
        Dados: {label} atrás
      </span>
      {/* Tooltip */}
      {show && (
        <div style={{position:"absolute",top:"18px",right:0,zIndex:50,
          background:"#1e2438",border:"1px solid #2a3042",borderRadius:"8px",
          padding:"10px 12px",minWidth:"210px",boxShadow:"0 8px 24px #00000080"}}>
          <div style={{fontSize:"9px",color:"#5a6478",letterSpacing:"0.8px",marginBottom:"8px",fontWeight:600}}>
            ÚLTIMA ACTUALIZAÇÃO
          </div>
          {Object.entries(tsLabels).map(([k,v]) => (
            <div key={k} style={{display:"flex",justifyContent:"space-between",gap:"12px",
              marginBottom:"5px",alignItems:"center"}}>
              <span style={{fontSize:"9px",color:"#787b86",minWidth:"72px"}}>{k}</span>
              <span style={{fontSize:"9px",color:"#c8ccd4",fontVariantNumeric:"tabular-nums",
                fontFamily:"'Inter',monospace"}}>{v || "—"}</span>
            </div>
          ))}
          <div style={{marginTop:"8px",paddingTop:"7px",borderTop:"1px solid #2a3042",
            fontSize:"9px",color:"#6b7280",letterSpacing:"0.3px"}}>
            Build: 2026-06-11 19:23 UTC
          </div>
        </div>
      )}
      <style>{`@keyframes ping{0%{transform:scale(1);opacity:.8}75%,100%{transform:scale(2.2);opacity:0}}`}</style>
    </div>
  );
}

// ─── PDF REPORT GENERATOR (light theme) ──────────────────────────────────────

function generateReportHTML(cards) {
  const today = new Date().toLocaleDateString('pt-PT');

  const fmtPct    = (v, d=2) => v == null ? '—' : `${v.toFixed(d)}%`;
  const fmtNum    = (v, d=1) => v == null ? '—' : v.toFixed(d);
  const fmtStr    = (v)      => v == null ? '—' : String(v);
  const fmtGrowth = (v, d=1) => v == null ? '—' : `${v>0?'+':''}${v.toFixed(d)}%`;

  // Light-theme color functions
  const peCol    = v => v==null?'#9ca3af':v<0?'#b91c1c':v<15?'#065f46':v<25?'#374151':v<40?'#92400e':'#b91c1c';
  const pbCol    = v => v==null?'#9ca3af':v<1?'#065f46':v<3?'#374151':v<10?'#92400e':'#b91c1c';
  const betaCol  = v => v==null?'#9ca3af':v<0.8?'#1e40af':v<1.2?'#374151':v<1.5?'#92400e':'#b91c1c';
  const deCol    = v => v==null?'#9ca3af':v<50?'#065f46':v<100?'#374151':v<200?'#92400e':'#b91c1c';
  const crCol    = v => v==null?'#9ca3af':v>=2?'#065f46':v>=1?'#374151':'#b91c1c';
  const marginCol= v => v==null?'#9ca3af':v>50?'#065f46':v>25?'#374151':'#92400e';
  const fcfCol   = v => v==null?'#9ca3af':v>15?'#065f46':v>0?'#374151':'#b91c1c';
  const roeCol   = v => v==null?'#9ca3af':v>20?'#065f46':v>10?'#374151':v>0?'#92400e':'#b91c1c';
  const growthCol= v => v==null?'#9ca3af':v>15?'#065f46':v>5?'#374151':v>0?'#92400e':'#b91c1c';
  const yieldCol = v => v==null?'#9ca3af':v>=5?'#065f46':v>=2?'#374151':'#9ca3af';
  const cagrCol  = v => v==null?'#9ca3af':v>10?'#065f46':v>0?'#374151':'#b91c1c';
  const payoutCol= v => v==null?'#9ca3af':v<50?'#065f46':v<80?'#92400e':'#b91c1c';
  const epsGrCol = v => v==null?'#9ca3af':v>20?'#065f46':v>5?'#374151':v>0?'#92400e':'#b91c1c';
  const psCol    = v => v==null?'#9ca3af':v<2?'#065f46':v<5?'#374151':v<10?'#92400e':'#b91c1c';
  const opMarCol = v => v==null?'#9ca3af':v>30?'#065f46':v>15?'#374151':v>0?'#92400e':'#b91c1c';
  const upsideCol= v => v==null?'#9ca3af':v>20?'#065f46':v>0?'#374151':v>-10?'#92400e':'#b91c1c';

  const sparkSVG = (values, color, w=72, h=24) => {
    if (!values || values.length < 2) return '';
    const mn = Math.min(...values), mx = Math.max(...values);
    const range = mx - mn || 1;
    const pad = 2;
    const pts = values.map((v, i) => {
      const x = pad + (i / (values.length - 1)) * (w - pad * 2);
      const y = (h - pad) - ((v - mn) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const lx = (pad + (w - pad * 2)).toFixed(1);
    const ly = ((h - pad) - ((values[values.length-1] - mn) / range) * (h - pad * 2)).toFixed(1);
    return `<svg width="${w}" height="${h}" style="display:block;flex-shrink:0"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="${color}"/></svg>`;
  };

  const priceSVG = (prices, w=540, h=90) => {
    if (!prices || prices.length < 2) return '';
    const mn = Math.min(...prices), mx = Math.max(...prices);
    const range = mx - mn || 1;
    const pad = 4;
    const isUp = prices[prices.length - 1] >= prices[0];
    const cc = isUp ? '#059669' : '#dc2626';
    const pts = prices.map((v, i) => {
      const x = pad + (i / (prices.length - 1)) * (w - pad * 2);
      const y = (h - pad) - ((v - mn) / range) * (h - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const lastPt = pts[pts.length - 1].split(',');
    const baseY = (h - pad).toFixed(1);
    const areaD = `M${pad},${baseY} L${pts.join(' L')} L${(w-pad).toFixed(1)},${baseY} Z`;
    const pct = ((prices[prices.length-1] - prices[0]) / prices[0] * 100).toFixed(2);
    return `<div style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
        <span style="font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:1px">Gráfico de Preço</span>
        <span style="font-size:11px;font-weight:700;color:${cc}">${pct>=0?'+':''}${pct}%</span>
      </div>
      <svg width="${w}" height="${h}" style="display:block;width:100%;border-radius:4px;background:#f8fafc;border:1px solid #e2e8f0">
        <defs><linearGradient id="pgpdf" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${cc}" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="${cc}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${areaD}" fill="url(#pgpdf)"/>
        <polyline points="${pts.join(' ')}" fill="none" stroke="${cc}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${lastPt[0]}" cy="${lastPt[1]}" r="3" fill="${cc}"/>
      </svg>
    </div>`;
  };

  const metric = (label, value, color, sparkValues) => `
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px">
      <div style="font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.6px;margin-bottom:5px">${label}</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:6px">
        <div style="font-size:12px;font-weight:700;color:${color};font-variant-numeric:tabular-nums;line-height:1">${value}</div>
        ${sparkValues ? sparkSVG(sparkValues, color) : ''}
      </div>
    </div>`;

  const sectionTitle = title => `
    <div style="font-size:8px;color:#9ca3af;letter-spacing:1.5px;text-transform:uppercase;margin:13px 0 6px 1px;font-weight:600">${title}</div>`;

  const weekRangeHTML = (data, sym) => {
    if (!data.week52Low || !data.week52High || !data.curPrice) return '';
    const pct = Math.max(0, Math.min(100, (data.curPrice - data.week52Low) / (data.week52High - data.week52Low) * 100));
    return `
    <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <span style="font-size:9px;color:#9ca3af">${sym}${data.week52Low.toFixed(2)}</span>
        <span style="font-size:8px;color:#9ca3af;text-transform:uppercase;letter-spacing:0.5px">52 semanas</span>
        <span style="font-size:9px;color:#9ca3af">${sym}${data.week52High.toFixed(2)}</span>
      </div>
      <div style="position:relative;height:5px;border-radius:3px;background:#e2e8f0">
        <div style="position:absolute;height:100%;border-radius:3px;background:linear-gradient(90deg,#ef5350 0%,#f97316 45%,#059669 100%);width:${pct}%"></div>
        <div style="position:absolute;top:-4px;width:3px;height:13px;background:#374151;border-radius:2px;left:calc(${pct}% - 1.5px)"></div>

      <div style="text-align:center;margin-top:4px;font-size:8px;color:#9ca3af">${pct.toFixed(0)}% do intervalo anual</div>
    </div>`;

  const cardHTML = ({ticker, data, chartPeriod = '6M'}) => {

    const periodPrices = ({ph1D:data.ph1D, ph6M:data.ph6M, ph5Y:data.ph5Y, phAll:data.phAll})[
      {['1D']:'ph1D',['6M']:'ph6M',['5Y']:'ph5Y',['All']:'phAll'}[chartPeriod] || 'ph6M'
    ] || data.ph6M || data.ph5Y || data.ph1D || data.phAll;
    const targetUpside = (data.targetPrice && data.curPrice)
      ? ((data.targetPrice / data.curPrice - 1) * 100) : null;
    return `
  <div class="page">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:14px;border-bottom:2px solid #e2e8f0;margin-bottom:14px">

const GH_SCREENER_WORKFLOW = "screener.yml";

function ScreenerFetchBar() {
  const [tickers,  setTickers]  = useState("");
  const [mode,     setMode]     = useState("add");
  const [status,   setStatus]   = useState("idle"); // idle | pat-needed | running | ok | err
  const [token,    setToken]    = useState(() => localStorage.getItem("gh_pat") || "");
  const [patInput, setPatInput] = useState("");
  const [errMsg,   setErrMsg]   = useState("");
  const modalRef = useRef(null);

  useEffect(() => {
    if (status !== "pat-needed") return;
    const h = e => { if (modalRef.current && !modalRef.current.contains(e.target)) setStatus("idle"); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, [status]);

  const doFetch = async (pat) => {
    setStatus("running");
    try {
      const res = await fetch(
        `https://api.github.com/repos/${GH_REPO}/actions/workflows/${GH_SCREENER_WORKFLOW}/dispatches`,
        {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${pat}`,
            "Accept":        "application/vnd.github+json",
            "Content-Type":  "application/json",
          },
          body: JSON.stringify({ ref: "main", inputs: { tickers: tickers.trim(), mode } }),
        }
      );
      if (res.status === 204) {
        setStatus("ok");
        setTimeout(() => setStatus("idle"), 10000);
      } else {
        const j = await res.json().catch(() => ({}));
        throw new Error(j.message || `HTTP ${res.status}`);
      }
    } catch(e) {
      setErrMsg(e.message);
      setStatus("err");
      setTimeout(() => setStatus("idle"), 5000);
    }
  };

  const handleFetch = () => {
    if (!tickers.trim() || status === "running") return;
    if (token) { doFetch(token); return; }
    setStatus("pat-needed");
  };

  const handlePatSave = () => {
    const pat = patInput.trim();
    if (!pat) return;
    localStorage.setItem("gh_pat", pat);
    setToken(pat);
    doFetch(pat);
  };

  const btnColor = status==="ok"?"#22C55E":status==="err"?"#ef5350":status==="running"?"#F59E0B":"#2962ff";
  const btnLabel = status==="running"?"⏳ A correr...":status==="ok"?"✓ Pedido enviado!":status==="err"?"✗ Erro":"Obter dados";

  return (
    <div style={{display:"flex",gap:"8px",alignItems:"center",flexWrap:"wrap"}}>
      {/* Ticker input */}
      <input
        value={tickers}
        onChange={e => setTickers(e.target.value)}
        onKeyDown={e => e.key === "Enter" && handleFetch()}
        placeholder="AAPL, MSFT, NVDA..."
        style={{
          minWidth:"200px",maxWidth:"360px",flex:"1",
          background:"#131722",border:"1px solid #2a3042",borderRadius:"6px",
          padding:"6px 10px",color:"#c8ccd4",fontSize:"11px",
          fontFamily:"'Inter',sans-serif",outline:"none",
        }}
      />

      {/* Mode toggle */}
      <div style={{display:"flex",gap:"2px",flexShrink:0}}>
        {[["add","Adicionar"],["replace","Substituir"]].map(([k,l]) => (
          <button key={k} onClick={() => setMode(k)} style={{
            fontSize:"9px",padding:"5px 10px",borderRadius:"20px",cursor:"pointer",
            border: mode===k?"1px solid #5a6478":"1px solid transparent",
            background: mode===k?"#1e2438":"transparent",
            color: mode===k?"#c8ccd4":"#6b7280",
            transition:"all 0.12s",fontFamily:"'Inter',sans-serif",
          }}>{l}</button>
        ))}
      </div>

      {/* Fetch button */}
      <div style={{position:"relative",flexShrink:0}}>
        <button onClick={handleFetch}
          disabled={!tickers.trim() || status === "running"}
          style={{
            fontSize:"10px",fontWeight:"600",padding:"6px 14px",borderRadius:"6px",cursor:"pointer",
            background: !tickers.trim()?"#1e2438":`${btnColor}22`,
            border: `1px solid ${!tickers.trim()?"#2a3042":btnColor}`,
            color: !tickers.trim()?"#5a6478":btnColor,
            fontFamily:"'Inter',sans-serif",transition:"all 0.15s",
          }}>
          {btnLabel}
        </button>

        {/* PAT modal */}
        {status === "pat-needed" && (
          <div ref={modalRef} style={{
            position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:200,
            background:"#1e2438",border:"1px solid #2a3042",borderRadius:"10px",
            padding:"14px",width:"270px",boxShadow:"0 8px 32px #00000099",
          }}>
            <div style={{fontSize:"9px",fontWeight:"600",color:"#c8ccd4",marginBottom:"4px"}}>
              GitHub Personal Access Token
            </div>
            <div style={{fontSize:"9px",color:"#6b7280",marginBottom:"10px",lineHeight:1.6}}>
              Scope necessário: <span style={{color:"#2962ff",fontFamily:"monospace"}}>repo</span>.{" "}
              <a href="https://github.com/settings/tokens/new?scopes=repo&description=Portfolio+Screener"
                target="_blank" rel="noopener" style={{color:"#2962ff",textDecoration:"none"}}>
                Criar token ↗
              </a>
            </div>
            <input autoFocus value={patInput} onChange={e => setPatInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && handlePatSave()}
              type="password" placeholder="ghp_xxxxxxxxxxxx"
              style={{width:"100%",background:"#131722",border:"1px solid #2a3042",borderRadius:"6px",
                padding:"6px 8px",color:"#c8ccd4",fontSize:"10px",fontFamily:"monospace",
                outline:"none",marginBottom:"8px"}}/>
            <div style={{display:"flex",gap:"6px",justifyContent:"flex-end"}}>
              <button onClick={() => setStatus("idle")}
                style={{fontSize:"9px",color:"#6b7280",background:"transparent",
                  border:"1px solid #2a3042",borderRadius:"5px",padding:"4px 10px",cursor:"pointer",
                  fontFamily:"'Inter',sans-serif"}}>
                Cancelar
              </button>
              <button onClick={handlePatSave}
                style={{fontSize:"9px",color:"#e0e3eb",background:"#2962ff",
                  border:"1px solid #2962ff",borderRadius:"5px",padding:"4px 12px",
                  fontWeight:"600",cursor:"pointer",fontFamily:"'Inter',sans-serif"}}>
                Guardar & Correr
              </button>
            </div>
            <div style={{fontSize:"9px",color:"#2a3042",marginTop:"8px",lineHeight:1.5}}>
              Token guardado apenas neste browser (localStorage).
            </div>
          </div>
        )}

        {/* Error tooltip */}
        {status === "err" && (
          <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:200,
            background:"#1A0000",border:"1px solid #7F1D1D",borderRadius:"6px",
            padding:"8px 10px",width:"220px",fontSize:"9px",color:"#F87171"}}>
            {errMsg}
          </div>
        )}
      </div>

      {status === "ok" && (
        <span style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.3px"}}>
          Aguarda ~1-2 min e actualiza a página
        </span>
      )}
    </div>
  );
}

function ScreenerCard({ ticker, data, onRemove, onDelete }) {
  const inPortfolio = positions.some(p => p.ticker === ticker);
  const col = SECTOR_COLORS[data.sector] || "#5a6478";

  const fmtPct = (v, d=2) => v == null ? "—" : `${v.toFixed(d)}%`;
  const fmtNum = (v, d=1) => v == null ? "—" : v.toFixed(d);
  const fmtStr = (v)       => v == null ? "—" : String(v);

  const yieldCol   = v => v==null?"#6b7280":v>=5?"#089981":v>=2?"#c8ccd4":"#5a6478";
  const peCol      = v => v==null?"#6b7280":v<0?"#ef5350":v<15?"#089981":v<25?"#c8ccd4":v<40?"#F0883E":"#ef5350";
  const pbCol      = v => v==null?"#6b7280":v<1?"#089981":v<3?"#c8ccd4":v<10?"#F0883E":"#ef5350";
  const betaCol    = v => v==null?"#6b7280":v<0.8?"#5b8af5":v<1.2?"#c8ccd4":v<1.5?"#F0883E":"#ef5350";
  const deCol      = v => v==null?"#6b7280":v<50?"#089981":v<100?"#c8ccd4":v<200?"#F0883E":"#ef5350";
  const crCol      = v => v==null?"#6b7280":v>=2?"#089981":v>=1?"#c8ccd4":"#ef5350";
  const cagrCol    = v => v==null?"#6b7280":v>10?"#089981":v>0?"#c8ccd4":"#ef5350";
  const payoutCol  = v => v==null?"#6b7280":v<50?"#089981":v<80?"#F0883E":"#ef5350";
  const marginCol  = v => v==null?"#6b7280":v>50?"#089981":v>25?"#c8ccd4":"#F0883E";
  const fcfCol     = v => v==null?"#6b7280":v>15?"#089981":v>0?"#c8ccd4":"#ef5350";
  const roeCol     = v => v==null?"#6b7280":v>20?"#089981":v>10?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const growthCol  = v => v==null?"#6b7280":v>15?"#089981":v>5?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const epsGrCol   = v => v==null?"#6b7280":v>20?"#089981":v>5?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const psCol      = v => v==null?"#6b7280":v<2?"#089981":v<5?"#c8ccd4":v<10?"#F0883E":"#ef5350";
  const opMarCol   = v => v==null?"#6b7280":v>30?"#089981":v>15?"#c8ccd4":v>0?"#F0883E":"#ef5350";
  const upsideCol  = v => v==null?"#6b7280":v>20?"#089981":v>0?"#c8ccd4":v>-10?"#F0883E":"#ef5350";

  const [chartPeriod, setChartPeriod] = useState("6M");

  // Price chart component
  const PriceChart = () => {
    const periodMap = {"1D": data.ph1D, "6M": data.ph6M, "5Y": data.ph5Y, "All": data.phAll};
    const prices = periodMap[chartPeriod] || [];
    const available = Object.keys(periodMap).filter(k => periodMap[k] && periodMap[k].length >= 2);
    if (prices.length < 2 && available.length === 0) return null;
    const activePrices = prices.length >= 2 ? prices : (periodMap[available[0]] || []);
    if (activePrices.length < 2) return null;
    const mn = Math.min(...activePrices), mx = Math.max(...activePrices);
    const range = mx - mn || 1;
    const W = 300, H = 80, pad = 3;
    const isUp = activePrices[activePrices.length - 1] >= activePrices[0];
    const cc = isUp ? "#089981" : "#ef5350";
    const pts = activePrices.map((v, i) => {
      const x = pad + (i / (activePrices.length - 1)) * (W - pad * 2);
      const y = (H - pad) - ((v - mn) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const lastPt = pts[pts.length - 1].split(",");
    const baseY = (H - pad).toFixed(1);
    const areaD = `M${pad},${baseY} L${pts.join(" L")} L${(W-pad).toFixed(1)},${baseY} Z`;
    const pricePct = ((activePrices[activePrices.length-1] - activePrices[0]) / activePrices[0] * 100);
    const gradId = `pg_${ticker}`;
    return (
      <div style={{marginBottom:"8px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"4px"}}>
          <span style={{fontSize:"10px",color:cc,fontWeight:"700",fontVariantNumeric:"tabular-nums"}}>
            {pricePct >= 0 ? "+" : ""}{pricePct.toFixed(2)}%
          </span>
          <div style={{display:"flex",gap:"2px"}}>
            {["1D","6M","5Y","All"].filter(p => periodMap[p] && periodMap[p].length >= 2).map(p => (
              <button key={p} onClick={() => setChartPeriod(p)}
                style={{
                  background: chartPeriod===p ? cc+"33" : "transparent",
                  border: `1px solid ${chartPeriod===p ? cc+"66" : "#2a3042"}`,
                  color: chartPeriod===p ? cc : "#5a6478",
                  fontSize:"9px",padding:"1px 6px",borderRadius:"3px",cursor:"pointer",
                  fontWeight: chartPeriod===p ? "700" : "400",
                  transition:"all 0.12s",
                }}>
                {p}
              </button>
            ))}
          </div>
        </div>
        <svg width={W} height={H} style={{width:"100%",display:"block",borderRadius:"4px"}}>
          <defs>
            <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stopColor={cc} stopOpacity="0.25"/>
              <stop offset="100%" stopColor={cc} stopOpacity="0.02"/>
            </linearGradient>
          </defs>
          <path d={areaD} fill={`url(#${gradId})`}/>
          <polyline points={pts.join(" ")} fill="none" stroke={cc}
            strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          <circle cx={lastPt[0]} cy={lastPt[1]} r="2.5" fill={cc}/>
        </svg>
      </div>
    );
  };

  // Mini sparkline SVG for historical trends
  const MiniSparkline = ({ values, color: sc = "#5a6478" }) => {
    if (!values || values.length < 2) return null;
    const mn = Math.min(...values), mx = Math.max(...values);
    const range = mx - mn || 1;
    const W = 48, H = 18, pad = 2;
    const pts = values.map((v, i) => {
      const x = pad + (i / (values.length - 1)) * (W - pad * 2);
      const y = (H - pad) - ((v - mn) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(" ");
    const lx = (W - pad).toFixed(1);
    const ly = ((H - pad) - ((values[values.length-1] - mn) / range) * (H - pad * 2)).toFixed(1);
    return (
      <svg width={W} height={H} style={{flexShrink:0,opacity:0.9}}>
        <polyline points={pts} fill="none" stroke={sc} strokeWidth="1.5"
          strokeLinecap="round" strokeLinejoin="round"/>
        <circle cx={lx} cy={ly} r="2" fill={sc}/>
      </svg>
    );
  };

  const CardItem = ({label, value, color, history}) => (
    <div style={{background:"#131722",borderRadius:"5px",padding:"7px 9px",border:"1px solid #1e2438"}}>
      <div style={{fontSize:"9px",color:"#6b7280",marginBottom:"4px",letterSpacing:"0.5px",textTransform:"uppercase"}}>{label}</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",gap:"4px"}}>
        <div style={{fontSize:"11px",color:color||"#c8ccd4",fontWeight:"600",fontVariantNumeric:"tabular-nums"}}>{value}</div>

      {/* AI Summary */}

function ScreenerView({ screenerDeleted: deleted, setScreenerDeleted: setDeleted }) {
  const allTickers = Object.keys(SCREENER_DATA);
  const [hidden, setHidden] = useState(() => {
    try { return JSON.parse(localStorage.getItem("screener_hidden") || "[]"); } catch { return []; }
  });

  const hide = t => setHidden(h => {
    const next = [...h, t];
    localStorage.setItem("screener_hidden", JSON.stringify(next));
    return next;
  });
  const del = t => {
    setDeleted(d => {
      const next = [...d, t];
      localStorage.setItem("screener_deleted", JSON.stringify(next));
      return next;
    });
    setHidden(h => {
      const next = h.filter(x => x !== t);
      localStorage.setItem("screener_hidden", JSON.stringify(next));
      return next;
    });
  };
  const restoreHidden = () => {
    setHidden([]);
    localStorage.removeItem("screener_hidden");
  };

  const visible = allTickers.filter(t => !hidden.includes(t) && !deleted.includes(t));

  return (
    <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",background:"#131722"}}>

      {/* Top bar */}
      <div className="no-print" style={{
        padding:"10px 16px",borderBottom:"1px solid #2a3042",background:"#1a1f2e",
        display:"flex",gap:"10px",alignItems:"center",flexShrink:0,flexWrap:"wrap",
      }}>
        <ScreenerFetchBar/>
        <div style={{flex:1}}/>
        {hidden.length > 0 && visible.length > 0 && (
          <button onClick={restoreHidden}
            title={`Mostrar ${hidden.length} stock(s) oculta(s)`}
            style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
              background:"#1e2438",border:"1px solid #2a3042",color:"#6b7280",
              fontFamily:"'Inter',sans-serif",flexShrink:0}}>
            Mostrar ocultas ({hidden.length})
          </button>
        )}
        {visible.length > 0 && (
          <button
            onClick={() => openPDF(visible.map(t => ({ticker: t, data: SCREENER_DATA[t], chartPeriod: "6M"})))}
            title={`Exportar ${visible.length} ${visible.length===1?'stock':'stocks'} em PDF`}
            style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
              background:"#1e2438",border:"1px solid #5a6478",color:"#787b86",
              fontFamily:"'Inter',sans-serif",display:"flex",alignItems:"center",gap:"5px",
              transition:"all 0.12s",flexShrink:0}}
            onMouseEnter={e=>{e.currentTarget.style.borderColor="#c8ccd4";e.currentTarget.style.color="#c8ccd4";}}
            onMouseLeave={e=>{e.currentTarget.style.borderColor="#5a6478";e.currentTarget.style.color="#787b86";}}>
            ⎙ Exportar PDF {visible.length > 1 ? `(${visible.length})` : ""}
          </button>
        )}
      </div>

      {/* Print-only header */}
      <div className="screener-print-header" style={{display:"none",padding:"0 0 12px",
        marginBottom:"12px",borderBottom:"1px solid #2a3042"}}>
        <div style={{fontSize:"16px",fontWeight:"700",color:"#e0e3eb"}}>Análise Fundamental</div>
        <div style={{fontSize:"9px",color:"#6b7280",marginTop:"4px"}}>
          Portfolio Tracker · Cláudio Trovisco · {new Date().toLocaleDateString("pt-PT")}
        </div>
      </div>

      {/* Cards grid or empty state */}
      {visible.length > 0 ? (
        <div style={{overflowY:"auto",flex:1,padding:"16px"}}>
          <div className="screener-grid" style={{
            display:"grid",
            gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",
            gap:"12px",
          }}>
            {visible.map(ticker => (
              <ScreenerCard
                key={ticker}
                ticker={ticker}
                data={SCREENER_DATA[ticker]}
                onRemove={hide}
                onDelete={del}
              />
            ))}
          </div>
        </div>
      ) : (
        <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
          justifyContent:"center",color:"#5a6478",gap:"14px",padding:"24px"}}>
          <div style={{fontSize:"36px",opacity:0.2}}>🔍</div>
          <div style={{fontSize:"12px",color:"#6b7280",textAlign:"center"}}>
            {allTickers.length === 0
              ? "Sem dados. Introduz tickers acima e clica em \"Obter dados\"."
              : "Todos os cards foram ocultados."}
          </div>
          {allTickers.length === 0 && (
            <div style={{fontSize:"10px",color:"#3d4760",textAlign:"center",maxWidth:"300px",lineHeight:1.7}}>
              Os dados são obtidos via GitHub Actions (~1-2 min).{" "}
              Precisas de um token GitHub com scope{" "}
              <span style={{color:"#2962ff",fontFamily:"monospace"}}>repo</span>.
            </div>
          )}
          {hidden.length > 0 && (
            <button onClick={restoreHidden}
              style={{fontSize:"9px",padding:"5px 12px",borderRadius:"5px",cursor:"pointer",
                background:"#1e2438",border:"1px solid #2a3042",color:"#787b86",
                fontFamily:"'Inter',sans-serif"}}>
              Mostrar ocultas ({hidden.length})
            </button>
          )}
        </div>
      )}
    </div>
  );
}

// ─── APP ─────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]           = useState("portfolio");
  const [screenerDeleted, setScreenerDeleted] = useState(() => {
    try { return JSON.parse(localStorage.getItem("screener_deleted") || "[]"); } catch { return []; }
  });
  const [sel, setSel]           = useState(null);
  const [mobPanel, setMobPanel] = useState(null); // null | "overview"
  const [mobDetail, setMobDetail] = useState(false); // mobile: detail panel open
  const [filter, setFilter]     = useState("all");
  const [sector, setSector]     = useState("all");
  const [sort, setSort]         = useState("ppl");

  // ── Resizable panes ────────────────────────────────────────────────
  const [rightW, setRightW]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_rightW"));
    return (v >= 180 && v <= 700) ? v : 310;
  });
  const [chartH, setChartH]   = useState(() => {
    const v = parseInt(localStorage.getItem("pane_chartH"));
    return (v >= 80 && v <= 600) ? v : 240;
  });
  const dragV = useRef(null); // { startX, startW }
  const dragH = useRef(null); // { startY, startH }

  useEffect(() => { localStorage.setItem("pane_rightW", rightW); }, [rightW]);
  useEffect(() => { localStorage.setItem("pane_chartH", chartH); }, [chartH]);

  function onDividerVMouseDown(e) {
    e.preventDefault();
    dragV.current = { startX: e.clientX, startW: rightW };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = dragV.current.startX - e.clientX;
      const next = Math.max(180, Math.min(700, dragV.current.startW + delta));
      setRightW(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }

  function onDividerHMouseDown(e) {
    e.preventDefault();
    dragH.current = { startY: e.clientY, startH: chartH };
    const el = e.currentTarget;
    el.classList.add("dragging");
    function onMove(e) {
      const delta = e.clientY - dragH.current.startY;
      const next = Math.max(80, Math.min(600, dragH.current.startH + delta));
      setChartH(next);
    }
    function onUp() {
      el.classList.remove("dragging");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
    }
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  }
  // ──────────────────────────────────────────────────────────────────

  const sectors = useMemo(() => [...new Set(positions.map(p => p.sector))].sort(), []);

  const filtered = useMemo(() => {
    let list = [...positions];
    if (filter === "ganhos") list = list.filter(p => p.ppl > 0);
    else if (filter === "perdas") list = list.filter(p => p.ppl < 0);
    if (sector !== "all") list = list.filter(p => p.sector === sector);
    if (sort === "ppl")   list.sort((a,b) => toEur(b.ppl, b.cur) - toEur(a.ppl, a.cur));
    if (sort === "pct")   list.sort((a,b) => pctReturn(b) - pctReturn(a));
    if (sort === "value") list.sort((a,b) => toEur(b.qty*b.curPrice, b.cur) - toEur(a.qty*a.curPrice, a.cur));
    if (sort === "name")  list.sort((a,b) => a.name.localeCompare(b.name));
    return list;
  }, [filter, sector, sort]);

  const selPos = sel ? positions.find(p => p.ticker === sel) : null;
  // Desktop: auto-open detail panel when a stock is selected.
  // Mobile: only opens when user explicitly taps "Ver Indicadores" (mobDetail) or opens overview.
  const isMobile = () => window.matchMedia('(max-width:768px)').matches;
  const panelOpen = !!(mobDetail || mobPanel === "overview");

  const pillStyle = (active) => ({
    padding:"3px 10px",borderRadius:"20px",fontSize:"10px",fontWeight:"500",
    border: active ? "1px solid #5a6478" : "1px solid transparent",
    background: active ? "#1e2438" : "transparent",
    color: active ? "#c8ccd4" : "#6b7280",
    cursor:"pointer",transition:"all 0.12s",whiteSpace:"nowrap",
  });

  return (
    <div style={{background:"#131722",height:"100vh",display:"flex",flexDirection:"column",
      fontFamily:"'Inter',sans-serif",color:"#c8ccd4",fontSize:"11px",overflow:"hidden"}}>

      {/* ── Header ── */}
      <div style={{background:"#1a1f2e",borderBottom:"1px solid #2a3042",padding:"0 16px",
        display:"flex",alignItems:"center",gap:"10px",height:"42px",flexShrink:0}}>
        <span style={{fontSize:"14px",fontWeight:"700",color:"#e0e3eb"}}>Portfolio Tracker</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-name" style={{fontFamily:"'Inter',sans-serif",fontSize:"12px",fontWeight:"700",
          color:"#6b7280",letterSpacing:"-0.2px"}}>Cláudio Trovisco</span>
        <div className="hdr-sep" style={{width:"1px",height:"16px",background:"#2a3042"}}/>
        <span className="hdr-live" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"1.5px"}}>
          TRADING212 · LIVE · {positions.length} POSIÇÕES
        </span>
        <div style={{flex:1}}/>
        {/* Tab navigation */}
        <div className="no-print" style={{display:"flex",gap:"2px",marginRight:"4px"}}>
          {[
            ["portfolio", "Portfolio"],
            ["screener",  (() => { const all = Object.keys(SCREENER_DATA); if (!all.length) return "Screener"; const n = all.filter(t => !screenerDeleted.includes(t)).length; return `Screener${n > 0 ? ` (${n})` : ""}`; })()],
          ].map(([k, l]) => (
            <button key={k} onClick={() => setTab(k)} style={{
              fontSize:"9px",padding:"4px 12px",borderRadius:"5px",cursor:"pointer",
              border:      tab===k ? "1px solid #2962ff"    : "1px solid transparent",
              background:  tab===k ? "#2962ff22"            : "transparent",
              color:       tab===k ? "#5b8af5"              : "#6b7280",
              fontFamily:"'Inter',sans-serif",fontWeight: tab===k?"600":"400",
              transition:"all 0.12s",
            }}>{l}</button>
          ))}
        </div>
        <FreshnessIndicator/>
        <div className="hdr-deploy"><DeployButton/></div>
        {/* Botão "Visão Geral" — só visível no mobile via CSS */}
        <button className="mob-overview-btn cb" style={{display:"none",
          fontSize:"9px",color:"#787b86",background:"#1e2438",
          border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}
          onClick={() => { setSel(null); setMobPanel("overview"); }}>
          ≡ Overview
        </button>
        {sel && (
          <button className="hdr-back cb" onClick={()=>setSel(null)}
            style={{fontSize:"9px",color:"#787b86",background:"#1e2438",
              border:"1px solid #5a6478",borderRadius:"5px",padding:"4px 10px",fontFamily:"'Inter',sans-serif"}}>
            ← Portfolio
          </button>
        )}
      </div>

      {/* ── Summary bar (portfolio only) ── */}
      {tab === "portfolio" && <Summary positions={positions} className="summary-bar"/>}

      {/* ── Screener view ── */}
      {tab === "screener" && <ScreenerView screenerDeleted={screenerDeleted} setScreenerDeleted={setScreenerDeleted}/>}

      {/* ── Main area: left column (chart + list) | right column (detail, full height) ── */}
      {tab === "portfolio" && <div className="main-grid" style={{display:"flex",flex:1,minHeight:0}}>

        {/* ── LEFT COLUMN ── */}
        <div style={{display:"flex",flexDirection:"column",flex:1,minWidth:0,overflow:"hidden"}}>

          {/* Chart */}
          <div className="chart-wrap" style={{flexShrink:0,height:`${chartH}px`,borderBottom:"1px solid #2a3042"}}>
            <ChartPanel sel={sel} positions={positions}/>
          </div>

          {/* "Ver Indicadores" button — mobile only, shown when a stock is selected */}
          {sel && selPos && (
            <div className="mob-indicators-btn" style={{display:"none",
              padding:"8px 12px", borderBottom:"1px solid #2a3042",
              background:"#1a1f2e", flexShrink:0}}>
              <button onClick={() => setMobDetail(true)} style={{
                width:"100%", padding:"9px", borderRadius:"6px",
                background:"#2a3042", border:"1px solid #3a4060",
                color:"#c8ccd4", fontSize:"12px", fontWeight:"600",
                cursor:"pointer", letterSpacing:"0.3px",
              }}>
                Ver Indicadores — {selPos.name} →
              </button>
            </div>
          )}

          {/* Horizontal divider — resize chart height */}
          <div className="divider-h" onMouseDown={onDividerHMouseDown} title="Arrastar para redimensionar"/>

          {/* Filter bar */}
          <div className="filter-bar" style={{padding:"6px 12px",borderBottom:"1px solid #2a3042",
            display:"flex",gap:"4px",alignItems:"center",flexShrink:0,background:"#1a1f2e"}}>

            <div style={{display:"flex",gap:"3px"}}>
              {[["all","Todas"],["ganhos","✦ Ganhos"],["perdas","✦ Perdas"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(filter===k)}
                  onClick={() => setFilter(k)}>{l}</button>
              ))}
            </div>

            <div className="filter-sep-v" style={{width:"1px",height:"14px",background:"#2a3042",margin:"0 2px"}}/>

            <div style={{position:"relative",display:"flex",alignItems:"center"}}>
              <select value={sector} onChange={e=>setSector(e.target.value)}
                style={{background:"#1a1f2e",border:"1px solid #2a3042",borderRadius:"20px",
                  color:sector!=="all"?"#c8ccd4":"#6b7280",fontSize:"10px",fontWeight:"500",
                  padding:"3px 22px 3px 10px",fontFamily:"'Inter',sans-serif",outline:"none"}}>
                <option value="all">Sector</option>
                {sectors.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
              <span style={{position:"absolute",right:"8px",color:"#6b7280",fontSize:"8px",pointerEvents:"none"}}>▾</span>
            </div>

            <div style={{flex:1}}/>

            <div className="filter-row-sort" style={{display:"flex",gap:"2px",alignItems:"center"}}>
              <span className="sort-label" style={{fontSize:"8px",color:"#5a6478",marginRight:"2px"}}>ordenar</span>
              {[["ppl","P&L€"],["pct","P&L%"],["value","Valor"],["name","A-Z"]].map(([k,l]) => (
                <button key={k} className="cb" style={pillStyle(sort===k)}
                  onClick={() => setSort(k)}>{l}</button>
              ))}
            </div>
          </div>

          {/* Table header */}
          <div className="pos-grid" style={{padding:"5px 12px",background:"#1a1f2e",
            borderBottom:"1px solid #1a1f2e",flexShrink:0}}>
            <div style={{fontSize:"9px",color:"#6b7280"}}></div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px"}}>EMPRESA</div>
            <div className="col-price-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>PREÇO</div>
            <div className="col-invested-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>INVESTIDO</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>VALOR</div>
            <div className="col-weight-hdr" style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>PESO</div>
            <div style={{fontSize:"9px",color:"#6b7280",letterSpacing:"0.5px",textAlign:"right"}}>RETORNO</div>
          </div>

          {/* Rows */}
          <div style={{overflowY:"auto",flex:1}}>
            {filtered.map(p => (
              <PositionRow key={p.ticker} p={p}
                selected={sel===p.ticker}
                onClick={() => { const next = sel===p.ticker ? null : p.ticker; setSel(next); setMobPanel(null); setMobDetail(!isMobile() && !!next); }}/>
            ))}
          </div>
        </div>

        {/* Vertical divider — resize right column width */}
        <div className="divider-v" onMouseDown={onDividerVMouseDown} title="Arrastar para redimensionar"/>

        {/* ── RIGHT COLUMN: Detail (full height; slide-in overlay no mobile) ── */}
        <div className={`right-col${panelOpen ? " open" : ""}`}
          style={{width:`${rightW}px`,flexShrink:0,overflowY:"auto",background:"#131722"}}>

          {/* Botão voltar — só visível no mobile (display:none no desktop via CSS) */}
          <div className="mob-back" style={{
            display:"none", position:"sticky", top:0, zIndex:10,
            background:"#1a1f2e", borderBottom:"1px solid #2a3042",
            padding:"0 16px", height:"48px",
            alignItems:"center", gap:"10px", flexShrink:0,
          }}>
            <button className="cb" onClick={() => { setSel(null); setMobPanel(null); setMobDetail(false); }} style={{
              fontSize:"12px", color:"#c8ccd4", background:"transparent",
              border:"none", padding:"8px 0", display:"flex", alignItems:"center", gap:"6px",
            }}>
              ← Voltar
            </button>
            <span style={{fontSize:"12px", fontWeight:"600", color:"#e0e3eb",
              overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>
              {selPos ? selPos.name : "Visão Geral"}
            </span>
          </div>

          {selPos
            ? <Detail p={selPos}/>
            : <PortfolioOverview positions={positions} onSelect={(t) => { setSel(t); setMobPanel(null); setMobDetail(!isMobile()); }}/>
          }
        </div>

      </div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
