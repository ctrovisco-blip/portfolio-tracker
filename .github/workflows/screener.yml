name: Stock Screener

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers a pesquisar (separados por vírgula, ex: AAPL,MSFT,NVDA)'
        required: true
        type: string
      mode:
        description: 'Adicionar ao existente ou substituir tudo'
        required: false
        default: 'add'
        type: choice
        options:
          - add
          - replace

concurrency:
  group: screener
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch screener fundamentals
        env:
          TICKERS:        ${{ github.event.inputs.tickers }}
          MODE:           ${{ github.event.inputs.mode }}
          FMP_API_KEY:    ${{ secrets.FMP_API_KEY }}
          FISCAL_API_KEY: ${{ secrets.FISCAL_API_KEY }}
        run: python fetch_screener.py

      - name: Fetch news
        continue-on-error: true
        run: python fetch_news.py

      # Watchlist: séries de preço + fundamentais yfinance para os tickers
      # do screener, para o entry_dashboard os avaliar com dados completos
      - name: Fetch chart data (inclui watchlist)
        continue-on-error: true
        run: python fetch_chart_data.py

      - name: Fetch fundamentals (inclui watchlist)
        continue-on-error: true
        run: python fetch_fundamentals.py

      - name: Build HTML
        run: python build_html.py

      - name: Build entry dashboard
        run: python build_entry_dashboard.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html entry_dashboard.html data/screener.json data/news.json data/chart_data.json data/fundamentals.json
          if git diff --staged --quiet; then
            echo "Sem alteracoes."
            exit 0
          fi
          git commit -m "feat: screener — ${{ github.event.inputs.tickers }} [skip ci]"
          git fetch origin main
          git rebase -X theirs origin/main
          git push origin main
